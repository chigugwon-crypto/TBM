<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>원주 TC TBM 일지 전자서명</title>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#f0f6ff;color:#0f172a;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;word-break:keep-all;font-size:14px}

/* 3. 교육서명 스타일 밝은 블루 그라데이션 상단 헤더 */
header{background:linear-gradient(135deg,#2563eb 0%,#1d4ed8 55%,#0284c7 100%);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:10;box-shadow:0 4px 14px rgba(37,99,235,0.22)}
header .htop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
header h1{margin:0;font-size:16px;font-weight:800;letter-spacing:-0.3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
header .badge-mode{font-size:11px;background:rgba(255,255,255,0.22);color:#fff;padding:2px 8px;border-radius:99px;font-weight:700}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:rgba(255,255,255,0.2);padding:4px;border-radius:12px;backdrop-filter:blur(4px)}
.tabs button{border:0;background:none;color:rgba(255,255,255,0.9);padding:9px 4px;border-radius:9px;font-weight:800;font-size:13px;cursor:pointer;transition:all .15s}
.tabs button.on{background:#ffffff;color:#1d4ed8;box-shadow:0 2px 8px rgba(15,23,42,0.15)}

main{max-width:640px;margin:0 auto;padding:12px}
.card{background:#fff;border:1px solid #dbeafe;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(37,99,235,0.04)}
.card h2{margin:0 0 8px;font-size:15px;color:#1e3a8a}
.sm{font-size:12px;color:#64748b}
.divider{height:1px;background:#e2e8f0;margin:14px 0}
label{display:block;font-size:12px;font-weight:700;margin:8px 0 4px;color:#334155}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;font-weight:700;background:#fff;color:#0f172a}
input:focus,select:focus,textarea:focus{outline:2px solid #3b82f6;border-color:#3b82f6}
input:disabled,select:disabled{background:#f1f5f9;color:#475569}

button.b{border:0;border-radius:12px;padding:12px;font-weight:800;font-size:14px;width:100%;margin-top:10px;background:#2563eb;color:#fff;cursor:pointer;transition:opacity .15s}
button.b:active{opacity:.85}
button.b:disabled{background:#e2e8f0;color:#94a3b8;cursor:not-allowed}
button.g{background:#059669}
button.r{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
button.w{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
button.y{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
button.s{width:auto;padding:6px 10px;font-size:12px;margin:0;border-radius:8px;cursor:pointer;font-weight:800}

.chk{display:flex;align-items:center;gap:8px;border:1px solid #e2e8f0;border-radius:10px;padding:9px;margin:5px 0;font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer}
.chk input{width:18px;height:18px;padding:0;accent-color:#10b981;flex-shrink:0}
.chk.on{background:#ecfdf5;border-color:#34d399;color:#065f46}
.tbm div{white-space:nowrap;font-size:11px;margin:3px 0}

.padbox{position:relative;height:150px;border:2px dashed #93c5fd;border-radius:12px;background:#f8fafc;overflow:hidden}
.padbox.ink{border:2px solid #2563eb;background:#fff}
.padbox canvas{width:100%;height:100%;display:block}
.padbox .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-weight:700;pointer-events:none;font-size:13px;padding:0 10px;text-align:center}
.padbox.ink .ph{display:none}
.padbox button{position:absolute;top:6px;right:6px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;font-weight:800;color:#64748b}
.cal button{color:#0f172a;border:1px solid #e2e8f0;background:#f8fafc;border-radius:8px;padding:5px 0;font-weight:800;font-size:12px;cursor:pointer}
.cal button small{display:block;font-size:9px;color:#94a3b8;font-weight:700}
.cal button.sg{background:#ecfdf5;border-color:#6ee7b7}.cal button.sg small{color:#047857}
.cal button.of{background:#fef2f2;border-color:#fecaca}.cal button.of small{color:#ef4444}
.cal button.wk{background:#fffbeb;border-color:#fcd34d}.cal button.wk small{color:#b45309}
.cal button.se{outline:2px solid #2563eb}
.sun{color:#dc2626!important}.sat{color:#2563eb!important}

.sub{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.sub button{border:1px solid #dbeafe;background:#ffffff;color:#475569;font-weight:800;font-size:12px;padding:8px 11px;border-radius:10px;cursor:pointer}
.sub button.on{background:#2563eb;color:#fff;border-color:#2563eb;box-shadow:0 2px 6px rgba(37,99,235,0.25)}

.row{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid #e2e8f0;border-radius:12px;padding:9px 11px;margin:7px 0;flex-wrap:wrap;background:#fff}
.row.ld{background:#eff6ff;border-color:#93c5fd}
.row.mn{background:#fffbeb;border-color:#fcd34d}
.tag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;white-space:nowrap}
.tag.m{background:#fef3c7;color:#92400e;border-color:#fcd34d}
.tag.c{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
.tag.l{background:#dbeafe;color:#1e40af;border-color:#93c5fd}
.row img{height:32px;max-width:76px;object-fit:contain;border:1px solid #e2e8f0;border-radius:6px;background:#fff;padding:2px}

.note{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:9px 10px;font-size:12px;margin-top:8px;line-height:1.45}
.note.bad{background:#fef2f2;border-color:#fecaca;color:#dc2626}
.lock{text-align:center;padding:16px;border-radius:14px;margin-top:10px;font-weight:800}
.lock.rd{background:#fef2f2;border:2px solid #fecaca;color:#dc2626}
.lock.ok{background:#ecfdf5;border:2px solid #a7f3d0;color:#047857}

#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:50;max-width:92%}
#toast div{padding:11px 16px;border-radius:12px;background:#1e3a8a;color:#fff;font-weight:800;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,0.2)}
#toast div.e{background:#dc2626}

/* 모달 (재서명/수정 및 비밀번호 상시 변경용) */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,0.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:14px}
.modal-card{background:#fff;border-radius:18px;max-width:440px;width:100%;padding:18px;box-shadow:0 12px 32px rgba(15,23,42,0.25);border:1px solid #dbeafe}
.modal-card h3{margin:0 0 8px;font-size:16px;color:#1e3a8a}

.scroll{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:6px;margin-bottom:14px;overflow:hidden}

/* ===== 출력 양식 (샘플 양식과 동일 구조) : 선 굵기는 --b 변수(축소 시 자동 보정) ===== */
.sh{--b:1px;background:#fff;color:#000;width:760px;margin:0 auto;padding:0;transform-origin:top left;font-family:'Batang','바탕','BatangChe','Noto Serif KR',serif;font-size:15px;line-height:1.3;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.sh table{width:100%;border-collapse:collapse;table-layout:fixed;border:calc(var(--b)*1.6) solid #000}
.sh td,.sh th{border:var(--b) solid #000;padding:2px 6px;text-align:center;vertical-align:middle;font-weight:400}
.sh .l{text-align:left}.sh .nw{white-space:nowrap}
.sh .go{font-family:'Gulim','굴림','Malgun Gothic','Apple SD Gothic Neo',sans-serif}
.sh .ln div{white-space:nowrap;height:24px;line-height:24px;font-size:13px;letter-spacing:-.2px;text-align:left}
.sh .ln.sf div{height:26px;line-height:26px;font-size:13.5px}
.sh .ln b{font-weight:800}
.sh .ln .ss{padding-left:14px}
.sh .ul{text-decoration:underline;text-underline-offset:5px}
.sh .sg th{height:30px}
.sh .sg td{height:34px;padding:0 2px;border-top:var(--b) dotted #000;border-bottom:var(--b) dotted #000}
.sh .sg td.gl{border-left:calc(var(--b)*1.6) solid #000}
.sh .sg td.nm{font-family:sans-serif;font-weight:600;font-size:12px}
.sh .sg img{height:26px;width:100%;object-fit:contain;display:block}
.sh .off{color:#777;font-size:11px;font-weight:400}

@media print{
 @page{size:A4 portrait;margin:8mm}
 body{background:#fff}
 header,.np,#toast,#modalRoot{display:none!important}
 main{max-width:none;padding:0}
 .scroll{border:0;padding:0;margin:0;border-radius:0;height:auto!important;overflow:visible;break-after:page;page-break-after:always}
 .scroll:last-child{break-after:auto;page-break-after:auto}
 .sh{--b:1px!important;transform:none!important;zoom:.94;break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <div class="htop">
    <h1>
      <span>🛡️ 원주 TC TBM 일지 전자서명</span>
      <span class="badge-mode" id="mode"></span>
    </h1>
    <div id="hdrActions"></div>
  </div>
  <div class="tabs">
    <button data-t="field" onclick="go('field')">✍️ 현장 서명 (CSM/프로)</button>
    <button data-t="admin" onclick="go('admin')">⚙️ 관리자 모드</button>
  </div>
</header>
<main id="app"></main>
<div id="modalRoot"></div>
<div id="toast"></div>

<script>
// ===== 설정: 기기 간 공유가 필요하면 Firebase Realtime Database 주소를 넣으세요 =====
const DB_URL = '';

const TBM = [
  '- <b>계절성</b>(혹한기,혹서기) 건강관리에 관한 사항 (온열질환,뇌심혈관질환등)',
  '- <b>중량물 취급</b>에 따른 안전관리 사항 (작업전 스트레칭, 보호구착용, 2인1조 인력취급등)',
  '- 차량운행 <b>음주운전 금지</b> 등 안전수칙에 관한 사항(과속,전방주시,신호준수등)',
  '- 배달·설치 중 안전관련 사항 (제품 운반시 , <b>A/C설치시 추락예방 기준</b> 준수등)',
  '* A/C 고소작업시 안전벨트 착용, 추락예방 장비 2점 고정 준수등',
  '- <b>급박한 위험발생시 작업중지</b> 권에 관한 사항(보고체계, 보고방법등)',
  '- <b>특수차량사용시</b> 안전(장소구획, 이삿짐리프트 탑승금지, 보호구착용, 아웃트리거 펼침등)'
];
const CHK = [
  '근로자 안전모,안전화 착용',
  'CSM 음주운전 여부 확인',
  'CSM 추락재해 예방 안전장구 상태',
  '계절성(혹한기,혹서기)안전조치 상태',
  '작업중지 대상 위험장소 확인',
  '특수차량 안전기준 준수상태 확인'
];
const DOW = ['일','월','화','수','목','금','토'];

// ---------- 유틸 ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mem = {};
const ls = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return mem[k] ?? null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } }
};
const qs = new URLSearchParams(location.search);
if (qs.get('db')) ls.set('tbm_db', qs.get('db'));
const DB = (ls.get('tbm_db') || DB_URL).replace(/\/$/, '');
const DEV = ls.get('tbm_dev') || (() => { const v = 'D' + Math.random().toString(36).slice(2, 10); ls.set('tbm_dev', v); return v; })();
const pad2 = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const dow = ds => { const [y, m, d] = ds.split('-').map(Number); return new Date(y, m - 1, d).getDay(); };
const dcls = w => w === 0 ? 'sun' : w === 6 ? 'sat' : '';
const minfo = ym => { const [y, m] = ym.split('-').map(Number); return { first: new Date(y, m - 1, 1).getDay(), last: new Date(y, m, 0).getDate() }; };
const keyOf = (date, name) => date + '_' + name.replace(/[.$#\[\]\/\s]/g, '');
const sample = n => 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="140" height="48"><path d="M12,34 Q32,8 52,30 T92,20 Q112,12 126,34" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/><text x="38" y="33" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">${esc(n)}</text></svg>`);

// ---------- 상태 (기본 8개 셀 및 인원 명단 세팅) ----------
const DEF_VER = '20261117_8cells_v2';
const defCells = () => [
  { id: 'BEST', type: 'appliance', name: '베스트', leader: '김세동', leaderSig: '' },
  { id: 'BASIC', type: 'appliance', name: '베이직', leader: '오성원', leaderSig: '' },
  { id: 'CHORONG', type: 'appliance', name: '초롱이', leader: '김영진', leaderSig: '' },
  { id: 'TOP', type: 'appliance', name: 'TOP', leader: '최종환', leaderSig: '' },
  { id: 'CHUNCHEON', type: 'appliance', name: '춘천피닉스', leader: '방만수', leaderSig: '' },
  { id: 'CHUNGJU', type: 'appliance', name: '충주이글스', leader: '김정호', leaderSig: '' },
  { id: 'SOMUL', type: 'appliance', name: '소물팀', leader: '', leaderSig: '' },
  { id: 'AC_SUPPORT', type: 'appliance', name: '에어컨 지원팀', leader: '장윤중', leaderSig: '' }
];
const defRoster = () => ({
  BEST: ['김세동', '김환신', '김민현', '고승수', '이원진', '전승구', '서광석', '함형국'],
  BASIC: ['오성원'],
  CHORONG: ['김영진', '박선현', '김용락', '김완기', '김태영', '양해준', '안대희', '김동하', '김배경'],
  TOP: ['최종환', '이성영', '김영준', '원용오', '김현규', '지원탁', '남동훈', '원호성', '박수현'],
  CHUNCHEON: ['방만수', '김종호', '김규철', '민경재', '윤민호', '이충모', '박도현', '양승원', '김희석', '채윤호', '이주섭', '차성준'],
  CHUNGJU: ['김정호', '조영행', '구현호', '이병호', '김동식', '김병수', '이대호', '박상현', '나관병', '황정남'],
  SOMUL: ['김승기', '김봉섭'],
  AC_SUPPORT: ['장윤중', '장필모', '임성훈']
});

// 2. 셀 인원 중 셀리더 상단 고정 + 그 외 인원 오름차순(가나다순) 정렬 함수
function sortRosterList(list, leaderName) {
  const cleanLeader = String(leaderName || '').trim();
  const unique = [...new Set((list || []).map(x => String(x || '').trim()).filter(Boolean))];
  if (cleanLeader && !unique.includes(cleanLeader)) {
    unique.unshift(cleanLeader);
  }
  const others = unique
    .filter(n => n !== cleanLeader)
    .sort((a, b) => a.localeCompare(b, 'ko'));
  return cleanLeader ? [cleanLeader, ...others] : others;
}

const fixCfg = c => {
  c = { pin: '1234', opinion: '', ...c };
  c.holidays = c.holidays || [];
  c.workdays = c.workdays || [];
  if (c.defVer !== DEF_VER) {
    c.defVer = DEF_VER;
    c.cells = defCells();
    c.roster = defRoster();
  }
  c.cells = (c.cells && c.cells.length ? Array.from(c.cells) : defCells()).filter(Boolean);
  c.cells = c.cells.map(x => ({ ...x, type: x.type || 'appliance' }));
  // 8개 셀이 가전 기본 목록에서도 한눈에 모두 보이도록 통합 유지
  c.roster = c.roster || defRoster();
  // 모든 셀 명단을 리더 상단 고정 + 오름차순으로 정규화
  c.cells.forEach(cell => {
    if (c.roster[cell.id]) {
      c.roster[cell.id] = sortRosterList(c.roster[cell.id], cell.leader);
    }
  });
  return c;
};

let S = (() => {
  try {
    const v = JSON.parse(ls.get('tbm_state'));
    return { sigs: v.sigs || {}, offs: v.offs || {}, cfg: fixCfg(v.cfg || {}) };
  } catch (e) {
    return { sigs: {}, offs: {}, cfg: fixCfg({}) };
  }
})();
const persist = () => ls.set('tbm_state', JSON.stringify(S));

let tab = 'field', sub = 'print', adminOK = false;
let date = today(), bound = { name: ls.get('tbm_name') || '', cell: ls.get('tbm_cell') || '' };
let ftype = 'appliance', fcell = S.cfg.cells.find(c => c.type === 'appliance')?.id || S.cfg.cells[0].id, fname = '';
let checks = CHK.map(() => false), pad = '', esig = '', esigCleared = false, padDirty = false;
let am = today().slice(0, 7), pc = '__all', pm = 'each', md = today();
let scType = 'appliance', sc = S.cfg.cells.find(c => c.type === 'appliance')?.id || S.cfg.cells[0].id;

const cellOf = id => S.cfg.cells.find(c => c.id === id);
const cellsOfType = type => S.cfg.cells.filter(c => c.type === type);
const typeLabel = type => type === 'ac' ? '에어컨' : '가전';
const typeOpts = selected => `<option value="appliance" ${selected === 'appliance' ? 'selected' : ''}>가전</option><option value="ac" ${selected === 'ac' ? 'selected' : ''}>에어컨</option>`;
const cellOpts = (sel, type) => S.cfg.cells.filter(c => !type || c.type === type).map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.name)}${c.leader ? ' (리더 ' + esc(c.leader) + ')' : ''}</option>`).join('');
const cellName = id => (cellOf(id) || {}).name || id || '-';

// 셀 명단 조회 시 항상 셀리더 최상단 + 가나다 오름차순 반환
const rost = id => {
  const c = cellOf(id);
  return sortRosterList(S.cfg.roster[id] || [], c ? c.leader : '');
};

const isOff = ds => S.cfg.holidays.includes(ds) || (dow(ds) === 0 && !S.cfg.workdays.includes(ds));
const isWorkerOff = (ds, name) => !!(S.offs && S.offs[keyOf(ds, name)]);
const mySig = ds => Object.values(S.sigs).find(s => s.date === ds && (s.dev === DEV || (bound.name && s.name === bound.name)));
const monthSigs = ym => Object.values(S.sigs).filter(s => s.date.startsWith(ym));

// ---------- 서버 동기화 (선택) ----------
const rput = (p, v) => DB ? fetch(`${DB}/${p}.json`, { method: 'PUT', body: JSON.stringify(v) }) : Promise.resolve();
const rdel = p => DB ? fetch(`${DB}/${p}.json`, { method: 'DELETE' }) : Promise.resolve();
async function poll() {
  if (!DB) return;
  try {
    const [a, b, o] = await Promise.all([
      fetch(`${DB}/sigs.json`).then(r => r.json()),
      fetch(`${DB}/cfg.json`).then(r => r.json()),

function initPad(id, cb) {
  const c = $(id); if (!c) return;
  const r = c.parentElement.getBoundingClientRect();
  c.width = r.width || 320; c.height = r.height || 150;
  const x = c.getContext('2d');
  x.lineWidth = 2.8; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#0f172a';
  c.style.touchAction = 'none';
  let d = false;
  const p = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = e => { e.preventDefault(); c.setPointerCapture(e.pointerId); d = true; padDirty = true; const [a, b] = p(e); x.beginPath(); x.moveTo(a, b); c.parentElement.classList.add('ink'); };
  c.onpointermove = e => { if (!d) return; const [a, b] = p(e); x.lineTo(a, b); x.stroke(); };
  c.onpointerup = c.onpointercancel = () => { if (!d) return; d = false; cb(c.toDataURL('image/png')); };
}
function clearPad(id, cb) {
  const c = $(id); if (!c) return;
  c.getContext('2d').clearRect(0, 0, c.width, c.height);
  c.parentElement.classList.remove('ink'); padDirty = false; cb('');
  if (id === '#epad') {
    esigCleared = true;
    const prev = $('#existingSigPreview');
    if (prev) prev.innerHTML = '<span style="color:#dc2626;font-weight:800">기존 서명 지우기 선택됨</span><span class="sm">저장 시 미서명 전환</span>';
  }
}

  document.querySelectorAll('.scroll').forEach(w => {
    const e = w.querySelector('.sh'); if (!e) return;
    const avail = w.clientWidth - 12, k = avail < 760 ? Math.max(.38, avail / 760) : 1;
    e.style.transform = k < 1 ? `scale(${k})` : 'none';
    e.style.setProperty('--b', (1 / k).toFixed(2) + 'px');
    w.style.height = (e.offsetHeight * k + 12) + 'px';
  });
}

// ---------- PDF 저장 ----------
const loadJS = u => new Promise((res, rej) => { const s = document.createElement('script'); s.src = u; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
async function savePDF() {
  toast('PDF를 만드는 중입니다...');
  try {
    if (!window.html2canvas) await loadJS('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if (!window.jspdf) await loadJS('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  } catch (e) { return toast('PDF 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요', 'e'); }
  const sheets = [...document.querySelectorAll('.sh')];
  if (!sheets.length) return toast('출력할 일지가 없습니다', 'e');
  const pdf = new window.jspdf.jsPDF('p', 'mm', 'a4');
  for (let i = 0; i < sheets.length; i++) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;left:-9999px;top:0;width:760px;background:#fff';
    const cl = sheets[i].cloneNode(true); cl.style.transform = 'none'; cl.style.setProperty('--b', '1px');
    wrap.appendChild(cl); document.body.appendChild(wrap);
    const cv = await html2canvas(cl, { scale: 2, backgroundColor: '#ffffff' });
    wrap.remove();
    const w = 194, h = Math.min(281, cv.height * w / cv.width);
    if (i) pdf.addPage();
    pdf.addImage(cv.toDataURL('image/jpeg', .95), 'JPEG', 8, 8, w, h);
  }
  const name = `TBM일지_${am}.pdf`, blob = pdf.output('blob'), file = new File([blob], name, { type: 'application/pdf' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => window.open(url, '_blank'), 400);
}

  else toast('비밀번호가 일치하지 않습니다', 'e');
}

// 새 셀 추가 (제한 없이 추가 가능 + 리더 입력 시 자동 명단 최상단 등록)
async function addCell() {
  const type = ($('#newCellType')?.value || scType || 'appliance');
  const name = ($('#newCellName')?.value || '').trim();
  const leader = ($('#newCellLeader')?.value || '').trim();
  if (!name) return toast('추가할 신규 셀명을 입력하세요', 'e');
  const id = (type === 'ac' ? 'AC' : 'GA') + Date.now().toString(36) + Math.random().toString(36).slice(2, 4);
  const cells = [...S.cfg.cells, { id, type, name, leader, leaderSig: '' }];
  const roster = { ...S.cfg.roster };
  if (leader) roster[id] = [leader];
  scType = type;
  sc = id;
  await saveCfg({ cells, roster });
  render();
  toast(`${typeLabel(type)} [${name}] 셀이 추가되었습니다`);
}

// 셀 삭제
async function delCell(cellId) {
  const c = cellOf(cellId);
  if (!c) return;
  if (S.cfg.cells.length <= 1) return toast('최소 1개의 셀은 유지되어야 합니다', 'e');
  if (!confirm(`[${typeLabel(c.type)} · ${c.name}] 셀을 삭제할까요?\n(이미 저장된 서명 기록은 보존됩니다)`)) return;
  const cells = S.cfg.cells.filter(x => x.id !== cellId);
  const nextCell = cells.find(x => x.type === scType) || cells[0];
  scType = nextCell.type;
  sc = nextCell.id;
  await saveCfg({ cells });
  render();
  toast(`${c.name}이(가) 삭제되었습니다`);
}

// 셀 정보 및 리더 저장 (리더는 자동으로 명단 최상단에 고정 + 나머지 가나다순 정렬)
async function saveCellInfo() {
  const c = cellOf(sc); if (!c) return;
  const name = ($('#cn')?.value || '').trim();
  const leader = ($('#ln')?.value || '').trim();
  if (!name) return toast('셀명을 입력하세요', 'e');
  const cells = S.cfg.cells.map(x => x.id === sc ? { ...x, name, leader } : x);
  const roster = { ...S.cfg.roster };
  roster[sc] = sortRosterList(roster[sc] || [], leader);
  await saveCfg({ cells, roster });
  render();
  toast('셀 정보 및 리더 상단 고정 정렬이 저장되었습니다');
}

// 명단에서 즉시 셀리더로 지정
async function setAsLeader(memberName) {
  const c = cellOf(sc); if (!c) return;
  const cells = S.cfg.cells.map(x => x.id === sc ? { ...x, leader: memberName } : x);
  const roster = { ...S.cfg.roster };
  roster[sc] = sortRosterList(roster[sc] || [], memberName);
  await saveCfg({ cells, roster });
  render();
  toast(`${memberName} 님이 ${c.name} 셀리더(최상단 고정)로 지정되었습니다`);
}

// 인원 추가 (셀리더 상단 고정 + 나머지 오름차순 자동 정렬)
async function addMember() {
  const v = ($('#rn')?.value || '').split(/[,，\n]/).map(x => x.trim()).filter(Boolean);
  if (!v.length) return toast('추가할 성명을 입력하세요', 'e');
  const c = cellOf(sc);
  const roster = { ...S.cfg.roster };
  const merged = [...rost(sc), ...v];
  roster[sc] = sortRosterList(merged, c ? c.leader : '');
  await saveCfg({ roster });
  render();
  toast('명단에 추가되어 가나다순으로 정렬되었습니다');
}

// 인원 이름 수정 (수정 후에도 리더 상단 + 가나다순 자동 유지)
async function editMember(oldName) {
  const c = cellOf(sc);
  const cur = [...rost(sc)];
  const idx = cur.indexOf(oldName);
  if (idx < 0) return;
  const next = prompt('작업자 이름을 수정하세요', oldName);
  if (next === null) return;
  const name = next.trim();
  if (!name) return toast('성명을 입력하세요', 'e');
  if (cur.some((n, i) => i !== idx && n === name)) return toast('이미 등록된 이름입니다', 'e');
  cur[idx] = name;
  const newLeader = (c && c.leader === oldName) ? name : (c ? c.leader : '');
  const cells = S.cfg.cells.map(x => x.id === sc ? { ...x, leader: newLeader } : x);
  const roster = { ...S.cfg.roster, [sc]: sortRosterList(cur, newLeader) };
  await saveCfg({ cells, roster });
  render();
  toast('인원 이름이 수정 및 정렬되었습니다');
}

// 인원 삭제
async function delMember(targetName) {
  const c = cellOf(sc);
  if (!confirm(`${targetName} 님을 명단에서 삭제할까요? (이미 저장된 서명은 유지됩니다)`)) return;
  const cur = rost(sc).filter(n => n !== targetName);
  const newLeader = (c && c.leader === targetName) ? '' : (c ? c.leader : '');
  const cells = S.cfg.cells.map(x => x.id === sc ? { ...x, leader: newLeader } : x);
  const roster = { ...S.cfg.roster, [sc]: sortRosterList(cur, newLeader) };
  await saveCfg({ cells, roster });
  render();
  toast(`${targetName} 님이 명단에서 삭제되었습니다`);
}

async function toggleOff(ds) {
  let h = [...S.cfg.holidays], w = [...S.cfg.workdays];
  const tg = (a, v) => a.includes(v) ? a.filter(x => x !== v) : [...a, v].sort();
  if (dow(ds) === 0) w = tg(w, ds); else h = tg(h, ds);
  await saveCfg({ holidays: h, workdays: w }); render();
}

async function saveSettings() {
  const newPin = ($('#pn')?.value || '').trim();
  if (!newPin) return toast('관리자 비밀번호를 입력해 주세요', 'e');
  const newDb = ($('#dbu')?.value || '').trim().replace(/\/$/, '');
  ls.set('tbm_db', newDb);
  await saveCfg({ opinion: $('#op').value, pin: newPin });
  if (newDb !== DB) {
    toast('공유 주소가 저장되어 새로고침합니다');
    return setTimeout(() => location.reload(), 600);
  }
  render(); toast('양식 설정 및 비밀번호가 저장되었습니다');
}
function exportBackup() {
  const raw = JSON.stringify(S);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(raw).then(() => toast('명단·서명 백업 데이터가 복사되었습니다')).catch(() => prompt('아래 내용을 전체 복사하세요', raw));
  } else {
    prompt('아래 내용을 전체 복사하세요', raw);
  }
}
async function importBackup() {
  const raw = prompt('복사해 둔 백업 데이터를 붙여넣으세요');
  if (!raw) return;
  try {
    const v = JSON.parse(raw);
    S = { sigs: v.sigs || {}, offs: v.offs || {}, cfg: fixCfg(v.cfg || {}) };
    persist();
    if (DB) await Promise.all([rput('cfg', S.cfg), rput('sigs', S.sigs), rput('offs', S.offs)]);
    render();
    toast('백업 데이터가 복원되었습니다');
  } catch (e) {
    toast('올바른 백업 데이터 형식이 아닙니다', 'e');
  }
}

// ---------- 렌더 ----------
function go(t) {
  tab = t;
  if (t === 'admin' && !cellOf(sc)) {
    scType = 'appliance';
    sc = (cellsOfType(scType)[0] || {}).id || '';
  }
  render();
}
function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  $('#mode').textContent = DB ? '실시간 서버공유' : '1인 1단말기';
  $('#hdrActions').innerHTML = (tab === 'admin' && adminOK)
    ? `<button type="button" class="b s" style="background:rgba(255,255,255,0.22);color:#fff;border:1px solid rgba(255,255,255,0.4)" onclick="openPinModal()">🔑 비번변경</button>`
    : '';
  $('#app').innerHTML = tab === 'field' ? fieldHTML() : adminHTML();
  if (tab === 'field') { upd(); initPad('#pad', v => pad = v); }
  fit();
}
window.addEventListener('resize', fit);
render(); poll(); setInterval(poll, 6000);
</script>
</body>
