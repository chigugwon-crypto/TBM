<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>원주 TC TBM 일지 전자서명</title>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#f1f5f9;color:#0f172a;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;word-break:keep-all;font-size:14px}
header{background:#0f172a;color:#fff;padding:10px 12px;position:sticky;top:0;z-index:5}
header h1{margin:0 0 8px;font-size:15px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#1e293b;padding:4px;border-radius:12px}
.tabs button{border:0;background:none;color:#cbd5e1;padding:9px 4px;border-radius:9px;font-weight:700;font-size:13px}
.tabs button.on{background:#2563eb;color:#fff}
main{max-width:640px;margin:0 auto;padding:12px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:15px}
.sm{font-size:12px;color:#64748b}
label{display:block;font-size:12px;font-weight:700;margin:8px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;font-weight:700;background:#fff}
input:disabled{background:#f1f5f9;color:#475569}
button.b{border:0;border-radius:12px;padding:12px;font-weight:800;font-size:14px;width:100%;margin-top:10px;background:#2563eb;color:#fff}
button.b:disabled{background:#e2e8f0;color:#94a3b8}
button.g{background:#10b981}
button.r{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
button.s{width:auto;padding:6px 10px;font-size:12px;margin:0;border-radius:8px}
.chk{display:flex;align-items:center;gap:8px;border:1px solid #e2e8f0;border-radius:10px;padding:9px;margin:5px 0;font-weight:700;font-size:13px;white-space:nowrap}
.chk input{width:18px;height:18px;padding:0}
.chk.on{background:#ecfdf5;border-color:#34d399}
.tbm div{white-space:nowrap;font-size:11px;margin:3px 0}
.padbox{position:relative;height:150px;border:2px dashed #cbd5e1;border-radius:12px;background:#f8fafc;overflow:hidden}
.padbox.ink{border:2px solid #2563eb;background:#fff}
.padbox canvas{width:100%;height:100%;display:block}
.padbox .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-weight:700;pointer-events:none;font-size:13px}
.padbox.ink .ph{display:none}
.padbox button{position:absolute;top:6px;right:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;font-weight:800;color:#64748b}
.cal button{color:#0f172a;border:1px solid #e2e8f0;background:#f8fafc;border-radius:8px;padding:5px 0;font-weight:800;font-size:12px}
.cal button small{display:block;font-size:9px;color:#94a3b8;font-weight:700}
.cal button.sg{background:#ecfdf5;border-color:#6ee7b7}.cal button.sg small{color:#047857}
.cal button.of{background:#fef2f2;border-color:#fecaca}.cal button.of small{color:#ef4444}
.cal button.wk{background:#fffbeb;border-color:#fcd34d}.cal button.wk small{color:#b45309}
.cal button.se{outline:2px solid #2563eb}
.sun{color:#dc2626!important}.sat{color:#2563eb!important}
.sub{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.sub button{border:0;background:#e2e8f0;color:#475569;font-weight:800;font-size:12px;padding:8px 10px;border-radius:10px}
.sub button.on{background:#0f172a;color:#fff}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid #e2e8f0;border-radius:12px;padding:9px;margin:7px 0;flex-wrap:wrap}
.row.mn{background:#fffbeb;border-color:#fcd34d}
.tag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.tag.m{background:#fef3c7;color:#92400e;border-color:#fcd34d}
.row img{height:30px;max-width:70px;object-fit:contain;border:1px solid #e2e8f0;border-radius:6px;background:#fff}
.note{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:8px;font-size:12px;margin-top:8px}
.note.bad{background:#fef2f2;border-color:#fecaca;color:#dc2626}
.lock{text-align:center;padding:16px;border-radius:14px;margin-top:10px;font-weight:800}
.lock.rd{background:#fef2f2;border:2px solid #fecaca;color:#dc2626}
.lock.ok{background:#ecfdf5;border:2px solid #a7f3d0;color:#047857}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:20;max-width:92%}
#toast div{padding:11px 16px;border-radius:12px;background:#0f172a;color:#fff;font-weight:800;font-size:13px}
#toast div.e{background:#dc2626}
.scroll{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:6px;margin-bottom:14px}

/* ===== 출력 양식 (샘플 양식과 동일 구조) : 선 굵기는 --b 변수(축소 시 자동 보정) ===== */
.sh{--b:1px;background:#fff;color:#000;width:760px;margin:0 auto;padding:0;transform-origin:top left;font-family:'Batang','바탕','BatangChe','Noto Serif KR',serif;font-size:15px;line-height:1.3;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.sh table{width:100%;border-collapse:collapse;table-layout:fixed;border:calc(var(--b)*1.6) solid #000}
.sh td,.sh th{border:var(--b) solid #000;padding:2px 6px;text-align:center;vertical-align:middle;font-weight:400}
.sh .l{text-align:left}.sh .nw{white-space:nowrap}
.sh .go{font-family:'Gulim','굴림','Malgun Gothic','Apple SD Gothic Neo',sans-serif}
.sh .ln div{white-space:nowrap;height:24px;line-height:24px;font-size:13px;letter-spacing:-.2px;text-align:left}
.sh .ln.sf div{height:26px;line-height:26px;font-size:13.5px}
.sh .ln b{font-weight:800}
.sh .ln .ss{padding-left:14px}
.sh .ul{text-decoration:underline;text-underline-offset:5px}
.sh .sg th{height:30px}
.sh .sg td{height:34px;padding:0 2px;border-top:var(--b) dotted #000;border-bottom:var(--b) dotted #000}
.sh .sg td.gl{border-left:calc(var(--b)*1.6) solid #000}
.sh .sg td.nm{font-family:sans-serif;font-weight:600;font-size:12px}
.sh .sg img{height:26px;width:100%;object-fit:contain;display:block}
.sh .off{color:#777;font-size:11px;font-weight:400}
.tag.c{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
.scroll{overflow:hidden}
@media print{
 @page{size:A4 portrait;margin:8mm}
 body{background:#fff}
 header,.np,#toast{display:none!important}
 main{max-width:none;padding:0}
 .scroll{border:0;padding:0;margin:0;border-radius:0;height:auto!important;overflow:visible;break-after:page;page-break-after:always}
 .scroll:last-child{break-after:auto;page-break-after:auto}
 .sh{--b:1px!important;transform:none!important;zoom:.94;break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <h1>원주 TC TBM 일지 전자서명 <span class="sm" id="mode" style="color:#93c5fd"></span></h1>
  <div class="tabs">
    <button data-t="field" onclick="go('field')">현장 서명</button>
    <button data-t="admin" onclick="go('admin')">관리자 (월말출력)</button>
  </div>
</header>
<main id="app"></main>
<div id="toast"></div>

<script>
// ===== 설정: 기기 간 공유가 필요하면 Firebase Realtime Database 주소를 넣으세요 =====
// 예: const DB_URL = 'https://내프로젝트-default-rtdb.firebaseio.com';
// 비워두면 이 기기(브라우저)에만 저장됩니다. (주소 뒤에 ?db=주소 를 붙여 열어도 적용)
const DB_URL = '';

const TBM = [
  '- <b>계절성</b>(혹한기,혹서기) 건강관리에 관한 사항 (온열질환,뇌심혈관질환등)',
  '- <b>중량물 취급</b>에 따른 안전관리 사항 (작업전 스트레칭, 보호구착용, 2인1조 인력취급등)',
  '- 차량운행 <b>음주운전 금지</b> 등 안전수칙에 관한 사항(과속,전방주시,신호준수등)',
  '- 배달·설치 중 안전관련 사항 (제품 운반시 , <b>A/C설치시 추락예방 기준</b> 준수등)',
  '* A/C 고소작업시 안전벨트 착용, 추락예방 장비 2점 고정 준수등',
  '- <b>급박한 위험발생시 작업중지</b> 권에 관한 사항(보고체계, 보고방법등)',
  '- <b>특수차량사용시</b> 안전(장소구획, 이삿짐리프트 탑승금지, 보호구착용, 아웃트리거 펼침등)'
];
const CHK = ['근로자 안전모,안전화 착용','CSM 음주운전 여부 확인','CSM 추락재해 예방 안전장구 상태','계절성(혹한기,혹서기)안전조치 상태','작업중지 대상 위험장소 확인','특수차량 안전기준 준수상태 확인'];
const DOW = ['일','월','화','수','목','금','토'];

// ---------- 유틸 ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mem = {};
const ls = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return mem[k] ?? null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } }
};
const qs = new URLSearchParams(location.search);
if (qs.get('db')) ls.set('tbm_db', qs.get('db'));
const DB = (ls.get('tbm_db') || DB_URL).replace(/\/$/, '');
const DEV = ls.get('tbm_dev') || (() => { const v = 'D' + Math.random().toString(36).slice(2, 10); ls.set('tbm_dev', v); return v; })();
const pad2 = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const dow = ds => { const [y, m, d] = ds.split('-').map(Number); return new Date(y, m - 1, d).getDay(); };
const dcls = w => w === 0 ? 'sun' : w === 6 ? 'sat' : '';
const minfo = ym => { const [y, m] = ym.split('-').map(Number); return { first: new Date(y, m - 1, 1).getDay(), last: new Date(y, m, 0).getDate() }; };
const keyOf = (date, name) => date + '_' + name.replace(/[.$#\[\]\/\s]/g, '');
const sample = n => 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="140" height="48"><path d="M12,34 Q32,8 52,30 T92,20 Q112,12 126,34" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/><text x="38" y="33" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">${esc(n)}</text></svg>`);

// ---------- 상태: 가전 베이직 + 고정 에어컨 셀 ----------
const BASIC_NAMES = ['김다빈','오성원','이재현','고도준','홍선일','김성진','지명환','하지현','염명성'];
const AC_CELLS = [
  ['AC_WJ_A','원주AC A팀'], ['AC_WJ_B','원주AC B팀'], ['AC_WJ_C','원주AC C팀'],
  ['AC_CH','춘천AC'], ['AC_CJ_A','충주 AC A팀'], ['AC_CJ_B','충주 AC B팀'],
  ['AC_HC','홍천AC'], ['AC_JC','제천AC']
];
const defCells = () => [
  { id: 'BASIC', type: 'appliance', name: '베이직', leader: '', leaderSig: '' },
  ...AC_CELLS.map(([id, name]) => ({ id, type: 'ac', name, leader: '', leaderSig: '' }))
];
const fixCfg = c => {
  c = { pin: '1234', opinion: '', ...c };
  c.holidays = c.holidays || []; c.workdays = c.workdays || [];
  c.cells = (c.cells && c.cells.length ? Array.from(c.cells) : defCells()).filter(Boolean);
  c.cells = c.cells.map(x => ({ ...x, type: x.type || 'appliance' }));
  // 기존 기본 셀만 남아있는 신규 사이트의 초기 설정을 새 고정 셀 구성으로 교체
  const legacyDefaults = c.cells.every(x => ['A','B','C','D','E','F','ACA','ACB'].includes(x.id));
  if (legacyDefaults) c.cells = defCells();
  c.roster = c.roster || {};
  if (!Object.prototype.hasOwnProperty.call(c.roster, 'BASIC')) c.roster.BASIC = [...BASIC_NAMES];
  return c;
};
let S = (() => { try { const v = JSON.parse(ls.get('tbm_state')); return { sigs: v.sigs || {}, cfg: fixCfg(v.cfg || {}) }; } catch (e) { return { sigs: {}, cfg: fixCfg({}) }; } })();
const persist = () => ls.set('tbm_state', JSON.stringify(S));
let tab = 'field', sub = 'print', adminOK = false;
let date = today(), bound = { name: ls.get('tbm_name') || '', cell: ls.get('tbm_cell') || '' };
let ftype = 'appliance', fcell = S.cfg.cells.find(c => c.type === 'appliance')?.id || S.cfg.cells[0].id, fname = '';
let checks = CHK.map(() => false), pad = '', lsig = '', padDirty = false;
let am = today().slice(0, 7), pc = '__all', pm = 'each', md = today();
let scType = 'appliance', sc = S.cfg.cells.find(c => c.type === 'appliance')?.id || S.cfg.cells[0].id;

const cellOf = id => S.cfg.cells.find(c => c.id === id);
const cellsOfType = type => S.cfg.cells.filter(c => c.type === type);
const typeLabel = type => type === 'ac' ? '에어컨' : '가전';
const typeOpts = selected => `<option value="appliance" ${selected === 'appliance' ? 'selected' : ''}>가전</option><option value="ac" ${selected === 'ac' ? 'selected' : ''}>에어컨</option>`;
const cellOpts = (sel, type) => S.cfg.cells.filter(c => !type || c.type === type).map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.name)}${c.leader ? ' (리더 ' + esc(c.leader) + ')' : ''}</option>`).join('');
const cellName = id => (cellOf(id) || {}).name || id || '-';
const rost = id => S.cfg.roster[id] || [];
const isOff = ds => S.cfg.holidays.includes(ds) || (dow(ds) === 0 && !S.cfg.workdays.includes(ds));
const mySig = ds => Object.values(S.sigs).find(s => s.date === ds && (s.dev === DEV || (bound.name && s.name === bound.name)));
const monthSigs = ym => Object.values(S.sigs).filter(s => s.date.startsWith(ym));

// ---------- 서버 동기화 (선택) ----------
const rput = (p, v) => DB ? fetch(`${DB}/${p}.json`, { method: 'PUT', body: JSON.stringify(v) }) : Promise.resolve();
const rdel = p => DB ? fetch(`${DB}/${p}.json`, { method: 'DELETE' }) : Promise.resolve();
async function poll() {
  if (!DB) return;
  try {
    const [a, b] = await Promise.all([fetch(`${DB}/sigs.json`).then(r => r.json()), fetch(`${DB}/cfg.json`).then(r => r.json())]);
    const ns = { sigs: a || {}, cfg: fixCfg({ ...S.cfg, ...(b || {}) }) };
    if (JSON.stringify(ns) !== JSON.stringify(S)) {
      S = ns; persist();
      const ae = document.activeElement;
      if (!padDirty && !(ae && /INPUT|SELECT|TEXTAREA/.test(ae.tagName))) render();
    }
  } catch (e) {}
}
async function saveSig(rec) { const k = keyOf(rec.date, rec.name); S.sigs[k] = rec; persist(); await rput('sigs/' + k, rec); }
async function delSig(k) { delete S.sigs[k]; persist(); await rdel('sigs/' + k); }
async function saveCfg(patch) { S.cfg = fixCfg({ ...S.cfg, ...patch }); persist(); await rput('cfg', S.cfg); }

function toast(msg, t) {
  $('#toast').innerHTML = `<div class="${t || ''}">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => $('#toast').innerHTML = '', 3200);
}

// ---------- 서명 패드 ----------
function initPad(id, cb) {
  const c = $(id); if (!c) return;
  const r = c.parentElement.getBoundingClientRect();
  c.width = r.width; c.height = r.height;
  const x = c.getContext('2d');
  x.lineWidth = 2.8; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#0f172a';
  c.style.touchAction = 'none';
  let d = false;
  const p = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = e => { e.preventDefault(); c.setPointerCapture(e.pointerId); d = true; padDirty = true; const [a, b] = p(e); x.beginPath(); x.moveTo(a, b); c.parentElement.classList.add('ink'); };
  c.onpointermove = e => { if (!d) return; const [a, b] = p(e); x.lineTo(a, b); x.stroke(); };
  c.onpointerup = c.onpointercancel = () => { if (!d) return; d = false; cb(c.toDataURL('image/png')); };
}
function clearPad(id, cb) {
  const c = $(id); c.getContext('2d').clearRect(0, 0, c.width, c.height);
  c.parentElement.classList.remove('ink'); padDirty = false; cb('');
}
const padHTML = (id, ph, cb) => `<div class="padbox"><div class="ph">${ph}</div><canvas id="${id}"></canvas><button class="b s r" onclick="clearPad('#${id}',${cb})">지우기</button></div>`;
const setPad = v => pad = v, setLsig = v => lsig = v;


// ---------- 현장 서명 화면 ----------
function fieldHTML() {
  const off = isOff(date), mine = mySig(date), mm = minfo(date.slice(0, 7)), ym = date.slice(0, 7), isB = !!bound.name;
  const myDays = Object.values(S.sigs).filter(s => s.date.startsWith(ym) && (s.dev === DEV || (isB && s.name === bound.name)));
  let cal = DOW.map((d, i) => `<div class="h ${dcls(i)}">${d}</div>`).join('') + '<div></div>'.repeat(mm.first);
  for (let i = 1; i <= mm.last; i++) {
    const ds = `${ym}-${pad2(i)}`, w = dow(ds), o = isOff(ds), sg = myDays.some(s => s.date === ds);
    cal += `<button class="${o ? 'of' : sg ? 'sg' : ''} ${ds === date ? 'se' : ''}" onclick="setDate('${ds}')"><span class="${dcls(w)}">${i}</span><small>${o ? '휴무' : sg ? '완료' : '-'}</small></button>`;
  }
  const who = isB ? `${cellName(bound.cell)} · ${bound.name}` : '본인';
  let body;
  if (off) body = `<div class="lock rd">🔒 ${date.slice(5).replace('-', '/')}(${DOW[dow(date)]}) 휴무일입니다<div class="sm" style="color:#ef4444;margin-top:4px">휴무일에는 서명할 수 없습니다. 근무일을 선택해 주세요.</div></div>`;
  else if (mine) body = `<div class="lock ok">✔ ${date.slice(5).replace('-', '/')} 서명이 완료되었습니다<div class="sm" style="margin:4px 0">1인 1단말기 정책으로 당일 추가 서명이 잠겼습니다.</div><img src="${mine.sig}" style="height:46px;background:#fff;border-radius:8px;padding:3px"></div>`;
  else body = `<label>본인 자필 서명</label>${padHTML('pad', esc(who) + ' 프로님의 서명을 그려주세요', 'setPad')}<button class="b" id="sub" onclick="submitSig()" disabled></button>`;
  const activeCell = isB ? bound.cell : fcell;
  const activeType = isB ? ((cellOf(bound.cell) || {}).type || 'appliance') : ftype;
  const rl = rost(activeCell);
  return `
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
    <div><div class="sm">1인 1단말기 인증</div><b>${isB ? esc(cellName(bound.cell)) + ' · ' + esc(bound.name) + ' 프로 전용 단말기' : '첫 서명 시 셀·성명이 고정됩니다'}</b></div>
    <div style="text-align:right"><div class="sm">이번 달</div><b style="color:#2563eb">${myDays.length}일 서명</b></div></div>
    ${isB ? `<button class="b s r" style="margin-top:8px" onclick="unbind()">기기변경/해제 (관리자 승인)</button>` : ''}</div>

function sheetList() {
  const ms = monthSigs(am), cells = S.cfg.cells.filter(c => pc === '__all' || c.id === pc), out = [];
  cells.forEach(c => {
    const cs = ms.filter(s => s.cell === c.id);
    if (pm === 'mix') {
      const map = {}; cs.forEach(s => { if (!map[s.date] || s.t > map[s.date].t) map[s.date] = s; });
      if (cs.length || pc !== '__all') out.push({ c, recs: Object.values(map) });
    } else {
      const names = [...new Set(cs.map(s => s.name))].sort();
      if (names.length) names.forEach(n => out.push({ c, recs: cs.filter(s => s.name === n) }));
      else if (pc !== '__all') out.push({ c, recs: [] });
    }
  });
  if (!out.length) out.push({ c: cells[0] || S.cfg.cells[0], recs: [] });
  return out;
}
// 화면 폭에 맞춰 축소 (zoom 대신 transform 사용 + 선 굵기 보정)
function fit() {
  document.querySelectorAll('.scroll').forEach(w => {
    const e = w.querySelector('.sh'); if (!e) return;
    const avail = w.clientWidth - 12, k = avail < 760 ? Math.max(.38, avail / 760) : 1;
    e.style.transform = k < 1 ? `scale(${k})` : 'none';
    e.style.setProperty('--b', (1 / k).toFixed(2) + 'px');
    w.style.height = (e.offsetHeight * k + 12) + 'px';
  });
}

// ---------- PDF 저장 (아이폰 대응: 공유 시트 / 다운로드) ----------
const loadJS = u => new Promise((res, rej) => { const s = document.createElement('script'); s.src = u; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
async function savePDF() {
  toast('PDF를 만드는 중입니다...');
  try {
    if (!window.html2canvas) await loadJS('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if (!window.jspdf) await loadJS('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  } catch (e) { return toast('PDF 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요', 'e'); }
  const sheets = [...document.querySelectorAll('.sh')];
  if (!sheets.length) return toast('출력할 일지가 없습니다', 'e');
  const pdf = new window.jspdf.jsPDF('p', 'mm', 'a4');
  for (let i = 0; i < sheets.length; i++) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;left:-9999px;top:0;width:760px;background:#fff';
    const cl = sheets[i].cloneNode(true); cl.style.transform = 'none'; cl.style.setProperty('--b', '1px');
    wrap.appendChild(cl); document.body.appendChild(wrap);
    const cv = await html2canvas(cl, { scale: 2, backgroundColor: '#ffffff' });
    wrap.remove();
    const w = 194, h = Math.min(281, cv.height * w / cv.width);
    if (i) pdf.addPage();
    pdf.addImage(cv.toDataURL('image/jpeg', .95), 'JPEG', 8, 8, w, h);
  }
  const name = `TBM일지_${am}.pdf`, blob = pdf.output('blob'), file = new File([blob], name, { type: 'application/pdf' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => window.open(url, '_blank'), 400);
}

    const lst = arr => arr.filter(d => d.startsWith(am)).map(d => `${+d.slice(8)}일(${DOW[dow(d)]})`).join(', ') || '없음';
    h += `<div class="np card"><h2>${am}월 휴무일 설정</h2><div class="sm">날짜를 누르면 휴무로 지정/해제됩니다. 일요일은 기본 휴무이며, 눌러서 근무일로 바꿀 수 있습니다.</div>
    <div class="cal" style="margin-top:10px">${cal}</div><div class="note">추가 지정 휴무일: ${lst(S.cfg.holidays)}<br>근무로 전환한 일요일: ${lst(S.cfg.workdays)}</div></div>`;
  }
  if (sub === 'set') {
    h += `<div class="np card"><h2>양식 설정</h2>
    <label>의견 청취란 (전체 셀 공통)</label><textarea id="op" rows="2">${esc(S.cfg.opinion)}</textarea>
    <label>관리자 비밀번호(PIN) 변경</label><input id="pn" type="password" value="${esc(S.cfg.pin)}">
    <button class="b" onclick="saveSettings()">설정 저장</button>
    <div class="note">저장 방식: <b>${DB ? '서버 공유 (여러 기기 동기화)' : '이 기기에만 저장'}</b>${DB ? '' : '<br>여러 휴대폰 간 서명 및 명단 공유를 위해서는 Firebase Realtime Database 연결이 필요합니다.'}</div></div>`;
  }
  return h;
}
function login() { if ($('#pin').value === S.cfg.pin) { adminOK = true; render(); } else toast('비밀번호가 일치하지 않습니다', 'e'); }
async function addCell() {
  const name = ($('#newCellName')?.value || '').trim();
  if (!name) return toast('추가할 셀명을 입력하세요', 'e');
  const id = (scType === 'ac' ? 'AC' : 'GA') + Date.now().toString(36);
  const cells = [...S.cfg.cells, { id, type: scType, name, leader: '', leaderSig: '' }];
  await saveCfg({ cells }); sc = id; render(); toast(`${typeLabel(scType)} ${name}이(가) 등록되었습니다`);
}
async function saveCellInfo() {
  const c = cellOf(sc); if (!c) return;
  const name = ($('#cn')?.value || '').trim();
  if (!name) return toast('셀명을 입력하세요', 'e');
  const cells = S.cfg.cells.map(x => x.id === sc ? { ...x, name, leader: ($('#ln')?.value || '').trim(), leaderSig: lsig || x.leaderSig } : x);
  lsig = ''; padDirty = false;
  await saveCfg({ cells }); render(); toast('셀 정보가 저장되었습니다');
}
async function deleteCell() {
  const c = cellOf(sc); if (!c) return;
  if (!confirm(`'${c.name}' 셀을 삭제할까요? 셀 명단은 삭제되며 기존 서명 기록은 보존됩니다.`)) return;
  const cells = S.cfg.cells.filter(x => x.id !== sc);
  const roster = { ...S.cfg.roster }; delete roster[sc];
  await saveCfg({ cells, roster });
  sc = (cellsOfType(scType)[0] || cells[0] || {}).id || '';
  render(); toast('셀과 셀 명단이 저장소에서 삭제되었습니다');
}
async function delLeaderSig() {
  await saveCfg({ cells: S.cfg.cells.map(x => x.id === sc ? { ...x, leaderSig: '' } : x) });
  render(); toast('리더 서명이 삭제되었습니다');
}
async function addMember() {
  const v = $('#rn').value.split(/[,，\n]/).map(x => x.trim()).filter(Boolean);
  if (!v.length) return toast('성명을 입력하세요', 'e');
  const roster = { ...S.cfg.roster }, cur = [...rost(sc)];
  v.forEach(n => { if (!cur.includes(n)) cur.push(n); });
  roster[sc] = cur; await saveCfg({ roster }); render(); toast('명단에 추가했습니다');
}
async function editMember(i) {
  const cur = [...rost(sc)], oldName = cur[i];
  const next = prompt('작업자 이름을 수정하세요', oldName);
  if (next === null) return;
  const name = next.trim();
  if (!name) return toast('성명을 입력하세요', 'e');
  if (cur.some((n, idx) => idx !== i && n === name)) return toast('이미 등록된 이름입니다', 'e');
  cur[i] = name;
  const roster = { ...S.cfg.roster, [sc]: cur };
  await saveCfg({ roster }); render(); toast('인원 이름이 수정되었습니다');
}
async function delMember(i) {
  const roster = { ...S.cfg.roster }, cur = [...rost(sc)];
  if (!confirm(`${cur[i]} 님을 명단에서 삭제할까요? (이미 저장된 서명은 유지됩니다)`)) return;
  cur.splice(i, 1); roster[sc] = cur; await saveCfg({ roster }); render();
}
async function toggleOff(ds) {
  let h = [...S.cfg.holidays], w = [...S.cfg.workdays];
  const tg = (a, v) => a.includes(v) ? a.filter(x => x !== v) : [...a, v].sort();
  if (dow(ds) === 0) w = tg(w, ds); else h = tg(h, ds);
  await saveCfg({ holidays: h, workdays: w }); render();
}
async function saveSettings() {
  await saveCfg({ opinion: $('#op').value, pin: $('#pn').value || '1234' });
  render(); toast('설정이 저장되었습니다');
}
async function fillSample() {
  const n = bound.name || '홍길동', cell = bound.cell || (pc !== '__all' ? pc : S.cfg.cells[0].id), s = sample(n);
  for (let d = 1; d <= 17; d++) { const ds = `${am}-${pad2(d)}`; if (!isOff(ds)) await saveSig({ date: ds, name: n, cell, sig: s, dev: DEV, manual: false, t: Date.now() }); }
  const c = cellOf(cell);
  if (c && !c.leaderSig) await saveCfg({ cells: S.cfg.cells.map(x => x.id === cell ? { ...x, leader: x.leader || '김세동', leaderSig: sample(x.leader || '김세동') } : x) });
  render(); toast('예시 서명을 채웠습니다');
}

// ---------- 렌더 ----------
function go(t) { tab = t; if (t === 'admin' && !cellOf(sc)) { scType='appliance'; sc=(cellsOfType(scType)[0]||{}).id||''; } render(); }
function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  $('#mode').textContent = DB ? '' : '· 이 기기 저장';
  $('#app').innerHTML = tab === 'field' ? fieldHTML() : adminHTML();
  if (tab === 'field') { upd(); initPad('#pad', v => pad = v); }
  else if (sub === 'roster' && adminOK) initPad('#lpad', v => lsig = v);
  fit();
}
window.addEventListener('resize', fit);
render(); poll(); setInterval(poll, 6000);
</script>
</body>
</html>
