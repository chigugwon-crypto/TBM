<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>원주 TC TBM 일지 및 일상점검표 전자서명</title>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#f0f6ff;color:#0f172a;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;word-break:keep-all;font-size:14px}

/* 상단 헤더 */
header{background:linear-gradient(135deg,#2563eb 0%,#1d4ed8 55%,#0284c7 100%);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:10;box-shadow:0 4px 14px rgba(37,99,235,0.22)}
header .htop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
header h1{margin:0;font-size:16px;font-weight:800;letter-spacing:-0.3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
header .badge-mode{font-size:11px;background:rgba(255,255,255,0.22);color:#fff;padding:2px 8px;border-radius:99px;font-weight:700}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:rgba(255,255,255,0.2);padding:4px;border-radius:12px;backdrop-filter:blur(4px)}
.tabs button{border:0;background:none;color:rgba(255,255,255,0.9);padding:9px 4px;border-radius:9px;font-weight:800;font-size:13px;cursor:pointer;transition:all .15s}
.tabs button.on{background:#ffffff;color:#1d4ed8;box-shadow:0 2px 8px rgba(15,23,42,0.15)}

main{max-width:640px;margin:0 auto;padding:12px}
.card{background:#fff;border:1px solid #dbeafe;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(37,99,235,0.04)}
.card h2{margin:0 0 8px;font-size:15px;color:#1e3a8a}
.sm{font-size:12px;color:#64748b}
.divider{height:1px;background:#e2e8f0;margin:14px 0}
label{display:block;font-size:12px;font-weight:700;margin:8px 0 4px;color:#334155}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;font-weight:700;background:#fff;color:#0f172a}
input:focus,select:focus,textarea:focus{outline:2px solid #3b82f6;border-color:#3b82f6}
input:disabled,select:disabled{background:#f1f5f9;color:#475569}

button.b{border:0;border-radius:12px;padding:12px;font-weight:800;font-size:14px;width:100%;margin-top:10px;background:#2563eb;color:#fff;cursor:pointer;transition:opacity .15s}
button.b:active{opacity:.85}
button.b:disabled{background:#e2e8f0;color:#94a3b8;cursor:not-allowed}
button.g{background:#059669}
button.r{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
button.w{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
button.y{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
button.s{width:auto;padding:6px 10px;font-size:12px;margin:0;border-radius:8px;cursor:pointer;font-weight:800}

.chk{display:flex;align-items:center;gap:8px;border:1px solid #e2e8f0;border-radius:10px;padding:9px;margin:5px 0;font-weight:700;font-size:12.5px;cursor:pointer}
.chk input{width:18px;height:18px;padding:0;accent-color:#10b981;flex-shrink:0}
.chk.on{background:#ecfdf5;border-color:#34d399;color:#065f46}
.chk .cat-tag{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:#eff6ff;color:#1d4ed8;flex-shrink:0}
.chk.on .cat-tag{background:#d1fae5;color:#047857}
.tbm div{white-space:nowrap;font-size:11px;margin:3px 0}

.padbox{position:relative;height:150px;border:2px dashed #93c5fd;border-radius:12px;background:#f8fafc;overflow:hidden}
.padbox.ink{border:2px solid #2563eb;background:#fff}
.padbox canvas{width:100%;height:100%;display:block}
.padbox .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-weight:700;pointer-events:none;font-size:13px;padding:0 10px;text-align:center}
.padbox.ink .ph{display:none}
.padbox button{position:absolute;top:6px;right:6px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;font-weight:800;color:#64748b}
.cal button{color:#0f172a;border:1px solid #e2e8f0;background:#f8fafc;border-radius:8px;padding:5px 0;font-weight:800;font-size:12px;cursor:pointer}
.cal button small{display:block;font-size:9px;color:#94a3b8;font-weight:700}
.cal button.sg{background:#ecfdf5;border-color:#6ee7b7}.cal button.sg small{color:#047857}
.cal button.of{background:#fef2f2;border-color:#fecaca}.cal button.of small{color:#ef4444}
.cal button.wk{background:#fffbeb;border-color:#fcd34d}.cal button.wk small{color:#b45309}
.cal button.se{outline:2px solid #2563eb}
.sun{color:#dc2626!important}.sat{color:#2563eb!important}

.sub{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.sub button{border:1px solid #dbeafe;background:#ffffff;color:#475569;font-weight:800;font-size:12px;padding:8px 11px;border-radius:10px;cursor:pointer}
.sub button.on{background:#2563eb;color:#fff;border-color:#2563eb;box-shadow:0 2px 6px rgba(37,99,235,0.25)}

.row{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid #e2e8f0;border-radius:12px;padding:9px 11px;margin:7px 0;flex-wrap:wrap;background:#fff}
.row.ld{background:#eff6ff;border-color:#93c5fd}
.row.mn{background:#fffbeb;border-color:#fcd34d}
.tag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;white-space:nowrap}
.tag.m{background:#fef3c7;color:#92400e;border-color:#fcd34d}
.tag.c{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
.tag.l{background:#dbeafe;color:#1e40af;border-color:#93c5fd}
.row img{height:32px;max-width:76px;object-fit:contain;border:1px solid #e2e8f0;border-radius:6px;background:#fff;padding:2px}

.note{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:9px 10px;font-size:12px;margin-top:8px;line-height:1.45}
.note.bad{background:#fef2f2;border-color:#fecaca;color:#dc2626}
.lock{text-align:center;padding:16px;border-radius:14px;margin-top:10px;font-weight:800}
.lock.rd{background:#fef2f2;border:2px solid #fecaca;color:#dc2626}
.lock.ok{background:#ecfdf5;border:2px solid #a7f3d0;color:#047857}

#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:50;max-width:92%}
#toast div{padding:11px 16px;border-radius:12px;background:#1e3a8a;color:#fff;font-weight:800;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,0.2)}
#toast div.e{background:#dc2626}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,0.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:14px}
.modal-card{background:#fff;border-radius:18px;max-width:440px;width:100%;padding:18px;box-shadow:0 12px 32px rgba(15,23,42,0.25);border:1px solid #dbeafe;max-height:90vh;overflow-y:auto}
.modal-card h3{margin:0 0 8px;font-size:16px;color:#1e3a8a}

.scroll{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:6px;margin-bottom:14px;overflow:hidden}

/* ===== 출력 양식 (A4 세로 1장 통합 또는 개별) ===== */
.sh{--b:1px;background:#fff;color:#000;width:760px;margin:0 auto;padding:0;transform-origin:top left;font-family:'Batang','바탕','BatangChe','Noto Serif KR',serif;font-size:15px;line-height:1.25;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.sh table{width:100%;border-collapse:collapse;table-layout:fixed;border:calc(var(--b)*1.5) solid #000}
.sh td,.sh th{border:var(--b) solid #000;padding:2px 5px;text-align:center;vertical-align:middle;font-weight:400}
.sh .l{text-align:left}.sh .nw{white-space:nowrap}
.sh .go{font-family:'Gulim','굴림','Malgun Gothic','Apple SD Gothic Neo',sans-serif}
.sh .ln div{white-space:nowrap;height:21px;line-height:21px;font-size:12.5px;letter-spacing:-.2px;text-align:left}
.sh .ln.sf div{height:23px;line-height:23px;font-size:13px}
.sh .ln b{font-weight:800}
.sh .ln .ss{padding-left:14px}
.sh .ul{text-decoration:underline;text-underline-offset:4px}
.sh .sg th{height:24px}
.sh .sg td{height:26px;padding:0 2px;border-top:var(--b) dotted #000;border-bottom:var(--b) dotted #000}
.sh .sg td.gl{border-left:calc(var(--b)*1.5) solid #000}
.sh .sg td.nm{font-family:sans-serif;font-weight:600;font-size:11.5px}
.sh .sg img{height:22px;width:100%;object-fit:contain;display:block}
.sh .off{color:#777;font-size:10.5px;font-weight:400}

/* 화물운송종사자 일상점검표 출력 전용 스타일 */
.sh .insp-wrap{font-family:'Malgun Gothic','Apple SD Gothic Neo','굴림',sans-serif;margin-top:8px}
.sh .insp-rule{font-size:10.5px;text-align:left;color:#111;margin-bottom:1px}
.sh .insp-title{font-size:17px;font-weight:800;text-align:center;letter-spacing:1px;margin:2px 0 5px}
.sh .insp-meta td{height:24px;font-size:11.5px;padding:2px 6px;text-align:left;font-weight:600}
.sh .insp-grid th,.sh .insp-grid td{padding:2px 1px;font-size:10px;height:34px;line-height:1.2}
.sh .insp-grid td.it{text-align:left;padding:3px 6px;font-size:10.5px;letter-spacing:-0.2px}
.sh .insp-grid td.cat{font-weight:700;font-size:11px;line-height:1.35}
.sh .insp-grid tr.sig-r td{height:44px;padding:1px 0;overflow:hidden;position:relative;vertical-align:middle}
.sh .insp-grid tr.sig-r img{height:38px;width:150%;max-width:none;margin-left:-25%;object-fit:contain;display:block;filter:contrast(1.5) brightness(0.8)}
.sh .insp-grid tr.act-r td{height:58px;font-size:11px}

@media print{
 @page{size:A4 portrait;margin:6mm}
 body{background:#fff}
 header,.np,#toast,#modalRoot{display:none!important}
 main{max-width:none;padding:0}
 .scroll{border:0;padding:0;margin:0;border-radius:0;height:auto!important;overflow:visible;break-after:page;page-break-after:always}
 .scroll:last-child{break-after:auto;page-break-after:auto}
 .sh{--b:1px!important;transform:none!important;zoom:.92;break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <div class="htop">
    <h1>
      <span>🛡️ 원주 TC TBM 일지 전자서명</span>
      <span class="badge-mode" id="mode"></span>
    </h1>
    <div id="hdrActions"></div>
  </div>
  <div class="tabs">
    <button data-t="field" onclick="go('field')">✍️ 현장 서명 (CSM/프로)</button>
    <button data-t="admin" onclick="go('admin')">⚙️ 관리자 모드</button>
  </div>
</header>
<main id="app"></main>
<div id="modalRoot"></div>
<div id="toast"></div>

<script>
// ===== 설정: 기기 간 공유가 필요하면 Firebase Realtime Database 주소를 넣으세요 =====
const DB_URL = '';

const TBM = [
  '- <b>계절성</b>(혹한기,혹서기) 건강관리에 관한 사항 (온열질환,뇌심혈관질환등)',
  '- <b>중량물 취급</b>에 따른 안전관리 사항 (작업전 스트레칭, 보호구착용, 2인1조 인력취급등)',
  '- 차량운행 <b>음주운전 금지</b> 등 안전수칙에 관한 사항(과속,전방주시,신호준수등)',
  '- 배달·설치 중 안전관련 사항 (제품 운반시 , <b>A/C설치시 추락예방 기준</b> 준수등)',
  '* A/C 고소작업시 안전벨트 착용, 추락예방 장비 2점 고정 준수등',
  '- <b>급박한 위험발생시 작업중지</b> 권에 관한 사항(보고체계, 보고방법등)',
  '- <b>특수차량사용시</b> 안전(장소구획, 이삿짐리프트 탑승금지, 보호구착용, 아웃트리거 펼침등)'
];
const CHK = [
  '근로자 안전모,안전화 착용',
  'CSM 음주운전 여부 확인',
  'CSM 추락재해 예방 안전장구 상태',
  '계절성(혹한기,혹서기)안전조치 상태',
  '작업중지 대상 위험장소 확인',
  '특수차량 안전기준 준수상태 확인'
];
// 화물자동차 운수사업법 시행규칙 [별지 제14호의5서식] 운수종사자 일상점검표 11개 항목
const INSP = [
  { cat: '외관점검', span: 4, text: '번호판, 전면유리, 후사경 등의 청결상태' },
  { cat: '외관점검', span: 0, text: '차미등, 차폭등 등 등화장치 작동상태' },
  { cat: '외관점검', span: 0, text: '창닦이기 작동상태' },
  { cat: '외관점검', span: 0, text: '적재함(보조지지대 포함), 측면 보호대, 후부반사판, 트레일러 연결장치의 부착 상태 및 훼손 여부' },
  { cat: '상태점검', span: 3, text: '타이어 손상 및 마모(1.6mm이상) 여부' },
  { cat: '상태점검', span: 0, text: '화물, 적재함 지지대(판스프링) 등의 고정상태' },
  { cat: '상태점검', span: 0, text: '바퀴 너트 등 균열 여부' },
  { cat: '기 타', span: 4, text: '냉각수, 공기압, 엔진오일 등 차량 이상 여부(계기판 확인)' },
  { cat: '기 타', span: 0, text: '좌석안전띠 상태' },
  { cat: '기 타', span: 0, text: '소화기 비치 여부' },
  { cat: '기 타', span: 0, text: '안전삼각대 등 비치 여부' }
];
const DOW = ['일','월','화','수','목','금','토'];

// ---------- 유틸 ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mem = {};
const ls = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return mem[k] ?? null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } }
};
const qs = new URLSearchParams(location.search);
if (qs.get('db')) ls.set('tbm_db', qs.get('db'));
const DB = (ls.get('tbm_db') || DB_URL).replace(/\/$/, '');
const DEV = ls.get('tbm_dev') || (() => { const v = 'D' + Math.random().toString(36).slice(2, 10); ls.set('tbm_dev', v); return v; })();
const pad2 = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const dow = ds => { const [y, m, d] = ds.split('-').map(Number); return new Date(y, m - 1, d).getDay(); };
const dcls = w => w === 0 ? 'sun' : w === 6 ? 'sat' : '';
const minfo = ym => { const [y, m] = ym.split('-').map(Number); return { first: new Date(y, m - 1, 1).getDay(), last: new Date(y, m, 0).getDate() }; };
const keyOf = (date, name) => date + '_' + name.replace(/[.$#\[\]\/\s]/g, '');

// ---------- 기본 가전 8개 셀 + 에어컨 8개 셀 고정 세팅 ----------
const defCells = () => [
  // 가전 8개 셀
  { id: 'BEST', type: 'appliance', name: '베스트', leader: '김세동' },
  { id: 'BASIC', type: 'appliance', name: '베이직', leader: '오성원' },
  { id: 'CHORONG', type: 'appliance', name: '초롱이', leader: '김영진' },
  { id: 'TOP', type: 'appliance', name: 'TOP', leader: '최종환' },
  { id: 'CHUNCHEON', type: 'appliance', name: '춘천피닉스', leader: '방만수' },
  { id: 'CHUNGJU', type: 'appliance', name: '충주이글스', leader: '김정호' },
  { id: 'SOMUL', type: 'appliance', name: '소물팀', leader: '' },
  { id: 'AC_SUPPORT', type: 'appliance', name: '에어컨 지원팀', leader: '장윤중' },
  // 에어컨 고정 8개 셀
  { id: 'WJ_AC_A', type: 'ac', name: '원주AC A팀', leader: '' },
  { id: 'WJ_AC_B', type: 'ac', name: '원주AC B팀', leader: '' },
  { id: 'WJ_AC_C', type: 'ac', name: '원주AC C팀', leader: '' },
  { id: 'CC_AC', type: 'ac', name: '춘천AC', leader: '' },
  { id: 'CJ_AC_A', type: 'ac', name: '충주 AC A팀', leader: '' },
  { id: 'CJ_AC_B', type: 'ac', name: '충주 AC B팀', leader: '' },
  { id: 'HC_AC', type: 'ac', name: '홍천AC', leader: '' },
  { id: 'JC_AC', type: 'ac', name: '제천AC팀', leader: '' }
];

const defRoster = () => ({
  BEST: ['김세동', '김환신', '김민현', '고승수', '이원진', '전승구', '서광석', '함형국'],
  BASIC: ['오성원', '김다빈', '이재현', '고도준', '홍선일', '김성전', '지명환', '하지현', '염명성'],
  CHORONG: ['김영진', '박선현', '김용락', '김완기', '김태영', '양해준', '안대희', '김동하', '김배경'],
  TOP: ['최종환', '이성영', '김영준', '원용오', '김현규', '지원탁', '남동훈', '원호성', '박수현'],
  CHUNCHEON: ['방만수', '김종호', '김규철', '민경재', '윤민호', '이충모', '박도현', '양승원', '김희석', '채윤호', '이주섭', '차성준'],
  CHUNGJU: ['김정호', '조영행', '구현호', '이병호', '김동식', '김병수', '이대호', '박상현', '나관병', '황정남'],
  SOMUL: ['김승기', '김봉섭'],
  AC_SUPPORT: ['장윤중', '장필모', '임성훈'],
  WJ_AC_A: [],
  WJ_AC_B: [],
  WJ_AC_C: [],
  CC_AC: [],
  CJ_AC_A: [],
  CJ_AC_B: [],
  HC_AC: [],
  JC_AC: []
});

// 셀 인원 중 셀리더 상단 고정 + 그 외 인원 오름차순(가나다순) 정렬
function sortRosterList(list, leaderName) {
  const cleanLeader = String(leaderName || '').trim();
  const unique = [...new Set((list || []).map(x => String(x || '').trim()).filter(Boolean))];
  if (cleanLeader && !unique.includes(cleanLeader)) {
    unique.unshift(cleanLeader);
  }
  const others = unique
    .filter(n => n !== cleanLeader)
    .sort((a, b) => a.localeCompare(b, 'ko'));
  return cleanLeader ? [cleanLeader, ...others] : others;
}

// 관리자 모드에서 수정·삭제한 내역을 영구 보존하는 비파괴 병합(fixCfg)
const LEGACY_IDS = ['A', 'B', 'C', 'D', 'E', 'F', 'ACA', 'ACB', 'CELL_MISSING'];
const fixCfg = c => {
  c = { pin: '1234', opinion: '', company: '선진물류㈜', ...c };
  c.holidays = c.holidays || [];
  c.workdays = c.workdays || [];
  c.deletedCells = c.deletedCells || [];
  c.cars = c.cars || {};

  const defaults = defCells();
  const defaultRos = defRoster();

  // 기존 저장된 셀 정리 (과거 임시 A~F셀 제거 및 사용자 수정 셀 보존)
  let existing = Array.isArray(c.cells) ? c.cells.filter(x => x && !LEGACY_IDS.includes(x.id)) : [];
  const byId = {};
  existing.forEach(x => { byId[x.id] = { ...x, type: x.type || 'appliance' }; });

  // 기본 16개 셀 중 사용자가 삭제하지 않은 셀 보장 (이미 있으면 사용자의 셀명/리더 수정값 유지)
  defaults.forEach(dc => {
    if (c.deletedCells.includes(dc.id)) return;
    if (!byId[dc.id]) {
      byId[dc.id] = { ...dc };
    }
  });

  // 정렬 순서: 기본 셀 순서 우선 + 사용자가 추가한 신규 셀
  const ordered = [];
  defaults.forEach(dc => {
    if (byId[dc.id]) {
      ordered.push(byId[dc.id]);
      delete byId[dc.id];
    }
  });
  Object.values(byId).forEach(customCell => ordered.push(customCell));
  c.cells = ordered.length ? ordered : defaults;

  // 로스터(인원 명단): 사용자가 이미 수정·저장한 배열이 있으면 절대 덮어쓰지 않고 보존
  c.roster = c.roster || {};
  // 베이직 셀이 이전에 ['오성원'] 1명만 있던 경우 9명 전체 기본값으로 보완 (최초 1회)
  if (!c.basicSeeded && (!c.roster.BASIC || c.roster.BASIC.length <= 1)) {
    c.roster.BASIC = defaultRos.BASIC;
    c.basicSeeded = true;
  }
  c.cells.forEach(cell => {
    if (!Array.isArray(c.roster[cell.id])) {
      c.roster[cell.id] = defaultRos[cell.id] ? [...defaultRos[cell.id]] : [];
    }
    c.roster[cell.id] = sortRosterList(c.roster[cell.id], cell.leader);
  });

  return c;
};

function initPad(id, cb) {
  const c = $(id); if (!c) return;
  const r = c.parentElement.getBoundingClientRect();
  c.width = r.width || 320; c.height = r.height || 150;
  const x = c.getContext('2d');
  x.lineWidth = 2.8; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#0f172a';
  c.style.touchAction = 'none';
  let d = false;
  const p = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = e => { e.preventDefault(); c.setPointerCapture(e.pointerId); d = true; padDirty = true; const [a, b] = p(e); x.beginPath(); x.moveTo(a, b); c.parentElement.classList.add('ink'); };
  c.onpointermove = e => { if (!d) return; const [a, b] = p(e); x.lineTo(a, b); x.stroke(); };
  c.onpointerup = c.onpointercancel = () => { if (!d) return; d = false; cb(cropSigCanvas(c)); };
}
function cropSigCanvas(c) {
  try {
    const w = c.width, h = c.height, ctx = c.getContext('2d');
    const data = ctx.getImageData(0, 0, w, h).data;
    let minX = w, minY = h, maxX = 0, maxY = 0, found = false;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (data[(y * w + x) * 4 + 3] > 20) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
          found = true;
        }
      }
    }
    if (!found) return c.toDataURL('image/png');
    const pad = 6;
    minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
    maxX = Math.min(w - 1, maxX + pad); maxY = Math.min(h - 1, maxY + pad);
    const cw = Math.max(24, maxX - minX + 1), ch = Math.max(16, maxY - minY + 1);
    const out = document.createElement('canvas');
    out.width = cw; out.height = ch;
    out.getContext('2d').drawImage(c, minX, minY, cw, ch, 0, 0, cw, ch);
    return out.toDataURL('image/png');
  } catch (e) {
    return c.toDataURL('image/png');
  }
}
function clearPad(id, cb) {
  const c = $(id); if (!c) return;
  c.getContext('2d').clearRect(0, 0, c.width, c.height);
  c.parentElement.classList.remove('ink'); padDirty = false; cb('');
  if (id === '#epad') {
    esigCleared = true;
    const prev = $('#existingSigPreview');
    if (prev) prev.innerHTML = '<span style="color:#dc2626;font-weight:800">기존 서명 지우기 선택됨</span><span class="sm">저장 시 미서명 전환</span>';
  }
}

function onSelectWorker(val) {
  fname = val;
  if (val && carOf(val)) fcar = carOf(val);
  render();
}
async function setFieldDuty(toOff) {
  const name = (bound.name || ($('#nm') && $('#nm').value) || fname || '').trim();
  const cell = bound.cell || fcell;
  const car = (($('#carNo') && $('#carNo').value) || fcar || carOf(name) || '').trim();
  if (!name) return toast('먼저 본인 성명을 선택해 주세요', 'e');
  if (toOff && mySig(date)) return toast('이미 당일 서명을 완료했습니다. 휴무로 바꾸려면 관리자에게 서명 삭제를 요청해 주세요', 'e');
  if (!bound.name) {
    bound = { name, cell, car };
    ls.set('tbm_name', name); ls.set('tbm_cell', cell); ls.set('tbm_car', car);
  }
  if (car) {
    S.cfg.cars = { ...(S.cfg.cars || {}), [name]: car };
    await saveCfg({ cars: S.cfg.cars });
  }
  const k = keyOf(date, name);
  S.offs = S.offs || {};
  if (toOff) {
    S.offs[k] = true;
    persist();
    await rput('offs/' + k, true);
    toast(`${date.slice(5).replace('-', '/')} ${name} 프로님 휴무(미운행)로 저장되었습니다`);
  } else {
    delete S.offs[k];
    persist();
    await rdel('offs/' + k);
    toast(`${date.slice(5).replace('-', '/')} ${name} 프로님 가동(정상근무)으로 전환되었습니다`);
  }
  render();
}
function upd() {
  const n1 = checks.filter(Boolean).length, n2 = ichecks.filter(Boolean).length;
  const c1 = $('#cnt'), c2 = $('#icnt'), b = $('#sub');
  if (c1) c1.textContent = `${n1}/${CHK.length} 확인됨`;
  if (c2) c2.textContent = `${n2}/${INSP.length} 확인됨`;
  if (b) {
    const ok = n1 === CHK.length && n2 === INSP.length;
    b.disabled = !ok;
    if (n1 < CHK.length) b.textContent = `안전조치 항목을 모두 체크해 주세요 (${n1}/${CHK.length})`;
    else if (n2 < INSP.length) b.textContent = `일상점검표 항목을 모두 체크해 주세요 (${n2}/${INSP.length})`;
    else b.textContent = `${date} TBM + 일상점검 서명 저장하기`;
  }
}
function chk(i, v) {
  checks[i] = v;
  const boxes = document.querySelectorAll('.card:nth-of-type(3) .chk');
  if (boxes[i]) boxes[i].classList.toggle('on', v);
  upd();
}
function ichk(i, v) {
  ichecks[i] = v;
  const boxes = document.querySelectorAll('.card:nth-of-type(4) .chk');
  if (boxes[i]) boxes[i].classList.toggle('on', v);
  upd();
}
function chkAll() {
  if (!bound.name && $('#nm')) fname = $('#nm').value || fname;
  if ($('#carNo')) fcar = $('#carNo').value || fcar;
  const t = !checks.every(Boolean);
  checks = checks.map(() => t);
  render();
}
function ichkAll() {
  if (!bound.name && $('#nm')) fname = $('#nm').value || fname;
  if ($('#carNo')) fcar = $('#carNo').value || fcar;
  const t = !ichecks.every(Boolean);
  ichecks = ichecks.map(() => t);
  render();
}
function chkAllBoth() {
  if (!bound.name && $('#nm')) fname = $('#nm').value || fname;
  if ($('#carNo')) fcar = $('#carNo').value || fcar;
  const allOn = checks.every(Boolean) && ichecks.every(Boolean);

  checks = checks.map(() => next);
  ichecks = ichecks.map(() => next);
  render();
}
function setDate(d) {
  if (!d) return;
  if (!bound.name && $('#nm')) fname = $('#nm').value;
  if ($('#carNo')) fcar = $('#carNo').value;
  date = d; pad = ''; padDirty = false; render();
}
function unbind() {
  if (prompt('관리자 비밀번호(PIN)를 입력하세요') === S.cfg.pin) {
    bound = { name: '', cell: '', car: '' };
    ls.set('tbm_name', ''); ls.set('tbm_cell', ''); ls.set('tbm_car', '');
    render(); toast('단말기 고정이 해제되었습니다');
  } else toast('비밀번호가 일치하지 않습니다', 'e');
}
async function submitSig() {
  const name = (bound.name || ($('#nm') && $('#nm').value) || '').trim();
  const cell = bound.cell || fcell;
  const car = (($('#carNo') && $('#carNo').value) || fcar || carOf(name) || '').trim();
  if (!name) return toast('성명을 선택해 주세요', 'e');
  if (isOff(date) || isWorkerOff(date, name)) return toast('휴무일에는 서명할 수 없습니다', 'e');
  if (!checks.every(Boolean)) return toast('안전조치 확인사항을 모두 체크해 주세요', 'e');
  if (!ichecks.every(Boolean)) return toast('화물운송종사자 일상점검표를 모두 체크해 주세요', 'e');
  if (!pad) return toast('서명란에 서명해 주세요', 'e');
  if (mySig(date)) return toast('이미 서명을 완료했습니다', 'e');
  if (!bound.name) {
    bound = { name, cell, car };
    ls.set('tbm_name', name); ls.set('tbm_cell', cell); ls.set('tbm_car', car);
  } else if (car) {
    bound.car = car; ls.set('tbm_car', car);
  }
  if (car) {
    S.cfg.cars = { ...(S.cfg.cars || {}), [name]: car };
    await saveCfg({ cars: S.cfg.cars });
  }
  await saveSig({
    date, name, cell, car,
    insp: ichecks.map(v => v ? 'O' : 'X'),
    sig: pad, dev: DEV, manual: false, t: Date.now()
  });
  pad = ''; padDirty = false; render();
  toast(`${date.slice(5).replace('-', '/')} ${name} 프로님 TBM 및 일상점검 서명이 저장되었습니다`);
}

   <tr><td rowspan="3" class="l go" style="padding:2px 6px"><div class="ln sf">${CHK.map(t => `<div>${t}</div>`).join('')}</div></td>
     <td rowspan="2" class="nw" style="font-size:16.5px;line-height:1.25">TBM<br>리더</td><td class="nw" style="height:38px;font-size:16.5px">소속</td><td class="l nw" style="font-size:16.5px">${esc(cell.name)}</td></tr>

     <td class="l"><span class="nw" style="font-size:16.5px;font-weight:700">${lead}</span></td></tr>

  const [y, m] = ym.split('-'), last = minfo(ym).last, map = {};

  const wName = workerName || (recs[0] && recs[0].name) || '';
  const carNo = (wName && carOf(wName)) || (recs.find(r => r.car)?.car) || '';
  const company = S.cfg.company || '선진물류㈜';

  // 1~31일 헤더
  let dayHeaders = '';
  for (let d = 1; d <= 31; d++) {
    dayHeaders += `<th style="height:24px;font-weight:700">${d}</th>`;
  }

  // 11개 점검항목 행 생성
  let itemRows = '';
  INSP.forEach((item, idx) => {
    let cells = '';
    if (item.span > 0) {
      cells += `<td rowspan="${item.span}" class="cat">${item.cat.replace(/\s/g, '').split('').join('<br>')}</td>`;
    }
    cells += `<td class="it">${esc(item.text)}</td>`;
    for (let d = 1; d <= 31; d++) {
      if (d > last) {
        cells += `<td></td>`;
      } else {
        const k = pad2(d), ds = `${ym}-${k}`, r = map[k];
        const off = !r && (isOff(ds) || (wName && isWorkerOff(ds, wName)));
        let mark = '';
        if (r) {
          mark = (r.insp && r.insp[idx]) ? (r.insp[idx] === 'O' ? '○' : r.insp[idx]) : '○';
        } else if (off) {
          mark = '<span style="color:#666;font-size:9px">미</span>';
        }
        cells += `<td style="font-weight:700">${mark}</td>`;
      }
    }
    itemRows += `<tr>${cells}</tr>`;
  });

  // 점검자 확인(서명) 행 (현장 서명 시 해당 일자 열에 서명 이미지 자동 연동, 휴무 시 '미' 표기)

    } else {

      const off = !r && (isOff(ds) || (wName && isWorkerOff(ds, wName)));
      if (r && r.sig) signCnt++;
      else if (off) offCnt++;
      sigCells += `<td>${r && r.sig ? `<img src="${r.sig}" alt="서명">` : off ? '<span style="color:#666;font-size:9px">미</span>' : ''}</td>`;
    }

  return `

    <div class="insp-title" style="font-size:23px;margin:6px 0 12px">운수종사자 일상점검표</div>
    <table class="insp-meta" style="margin-bottom:8px">

          <td style="font-size:12.5px">운수종사자명 : <b style="font-size:14px">${esc(wName)}</b> <span style="font-size:10.5px;color:#475569">(${esc(cell.name)})</span></td>
        </tr>
      </tbody>
    </table>
    <table class="insp-grid">
      <colgroup>
        <col style="width:4.2%">
        <col style="width:21.8%">
        ${'<col style="width:2.387%">'.repeat(31)}
      </colgroup>
      <thead>
        <tr>
          <th colspan="2" rowspan="2" style="font-weight:700;font-size:11.5px">점검항목</th>
          <th colspan="31" style="font-weight:700;font-size:11px;height:24px">점검결과(양호 ○, 불량 ×, 미운행시 “미” 기입) — 월 누적 점검 ${signCnt}일 · 미운행 ${offCnt}일</th>
        </tr>
        <tr>${dayHeaders}</tr>
      </thead>
      <tbody>
        ${itemRows}
        <tr class="sig-r">${sigCells}</tr>
        <tr class="act-r">
          <td></td>
          <td style="font-weight:700;font-size:11px">불량상태 조치 기록</td>
          <td colspan="31"></td>
        </tr>
      </tbody>
    </table>
  </div>`;
}

function sheet(ym, cell, recs, workerName, modeOverride, dateOverride) {
  const mode = modeOverride || pm;
  if (mode === 'insp') {
    return `<div class="scroll"><div class="sh">${inspTableHTML(ym, cell, recs, workerName)}</div></div>`;
  }
  if (mode === 'daily' || mode === 'daily_month') {
    return `<div class="scroll"><div class="sh">${tbmDailyCellHTML(dateOverride || pd, cell, recs)}</div></div>`;
  }
  return `<div class="scroll"><div class="sh">${tbmTableHTML(ym, cell, recs, workerName)}</div></div>`;
}

function workerListOfCell(cellObj, monthRecs) {
  if (!cellObj) return [];
  const cs = monthRecs.filter(s => s.cell === cellObj.id);
  const signedNames = [...new Set(cs.map(s => s.name))];
  const rosNames = rost(cellObj.id);
  return sortRosterList([...new Set([...rosNames, ...signedNames])], cellObj.leader);
}

function sheetList(typeFilter, cellFilter, modeOverride, workerFilter) {
  const mode = modeOverride || pm;
  const ms = monthSigs(am);
  const typeCells = S.cfg.cells.filter(c => !typeFilter || c.type === typeFilter);
  const cells = typeCells.filter(c => cellFilter === '__all' || c.id === cellFilter);
  const out = [];

  if (mode === 'daily') {
    // 선택한 일자(pd) 기준 셀별 1장 (해당 날짜에 셀원 전원의 서명이 1장에 표시)
    const dayRecs = Object.values(S.sigs).filter(s => s.date === pd);
    const rosCheck = c => rost(c.id);
    cells.forEach(c => {
      const members = rosCheck(c);
      const cs = dayRecs.filter(s => s.cell === c.id || (members.includes(s.name) && !s.cell));
      if (members.length || cs.length || cellFilter !== '__all') {
        out.push({ c, recs: cs, w: '', d: pd });
      }
    });
    if (!out.length) out.push({ c: cells[0] || typeCells[0] || S.cfg.cells[0], recs: [], w: '', d: pd });
    return out;
  }

  if (mode === 'daily_month') {
    // 대상 연월(am) 중 서명 기록이 있는 날짜마다 셀별 1장씩 일별로 생성
    cells.forEach(c => {
      const members = rost(c.id);
      const cs = ms.filter(s => s.cell === c.id || (members.includes(s.name) && !s.cell));
      const dates = [...new Set(cs.map(s => s.date))].sort();
      if (dates.length) {
        dates.forEach(ds => {
          out.push({ c, recs: cs.filter(s => s.date === ds), w: '', d: ds });
        });
      } else if (cellFilter !== '__all') {
        out.push({ c, recs: [], w: '', d: pd.startsWith(am) ? pd : `${am}-01` });
      }
    });
    if (!out.length) out.push({ c: cells[0] || typeCells[0] || S.cfg.cells[0], recs: [], w: '', d: pd });
    return out;
  }

  cells.forEach(c => {
    const cs = ms.filter(s => s.cell === c.id);
    if (mode === 'mix') {
      const map = {}; cs.forEach(s => { if (!map[s.date] || s.t > map[s.date].t) map[s.date] = s; });
      if (cs.length || cellFilter !== '__all') out.push({ c, recs: Object.values(map), w: '' });
    } else {
      // 개인별 1장 (1일~말일 월 누적): 일상점검표 등에서 개인 1장씩 생성
      let names = workerListOfCell(c, ms);
      if (workerFilter && workerFilter !== '__all') {
        names = names.filter(n => n === workerFilter);
      }
      if (names.length) {
        names.forEach(n => {
          const personRecs = ms.filter(s => s.name === n && (s.cell === c.id || !s.cell));
          out.push({ c, recs: personRecs, w: n });
        });
      } else if (cellFilter !== '__all') {
        out.push({ c, recs: [], w: c.leader || '' });
      }
    }
  });
  if (!out.length) out.push({ c: cells[0] || typeCells[0] || S.cfg.cells[0], recs: [], w: '' });
  return out;
}

function fit() {
  document.querySelectorAll('.scroll').forEach(w => {
    const e = w.querySelector('.sh'); if (!e) return;
    const avail = w.clientWidth - 12, k = avail < 760 ? Math.max(.38, avail / 760) : 1;
    e.style.transform = k < 1 ? `scale(${k})` : 'none';
    e.style.setProperty('--b', (1 / k).toFixed(2) + 'px');
    w.style.height = (e.offsetHeight * k + 12) + 'px';
  });
}

// ---------- PDF 저장 ----------
const loadJS = u => new Promise((res, rej) => { const s = document.createElement('script'); s.src = u; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
async function savePDF() {
  toast('PDF를 만드는 중입니다...');
  try {
    if (!window.html2canvas) await loadJS('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if (!window.jspdf) await loadJS('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  } catch (e) { return toast('PDF 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요', 'e'); }
  const sheets = [...document.querySelectorAll('.sh')];
  if (!sheets.length) return toast('출력할 일지가 없습니다', 'e');
  const pdf = new window.jspdf.jsPDF('p', 'mm', 'a4');
  for (let i = 0; i < sheets.length; i++) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;left:-9999px;top:0;width:760px;background:#fff';
    const cl = sheets[i].cloneNode(true); cl.style.transform = 'none'; cl.style.setProperty('--b', '1px');
    wrap.appendChild(cl); document.body.appendChild(wrap);
    const cv = await html2canvas(cl, { scale: 2, backgroundColor: '#ffffff' });
    wrap.remove();
    const maxW = 198, maxH = 285;
    let w = maxW, h = cv.height * w / cv.width;
    if (h > maxH) { h = maxH; w = cv.width * h / cv.height; }
    const x = (210 - w) / 2;
    if (i) pdf.addPage();
    pdf.addImage(cv.toDataURL('image/jpeg', .95), 'JPEG', x, 6, w, h);
  }
  const name = `${sub === 'insp' ? '화물운송종사자_일상점검표' : 'TBM일지'}_${am}.pdf`, blob = pdf.output('blob'), file = new File([blob], name, { type: 'application/pdf' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => window.open(url, '_blank'), 400);
}

function login() {
  if ($('#pin').value === S.cfg.pin) { adminOK = true; render(); toast('관리자 모드로 입장했습니다'); }
  else toast('비밀번호가 일치하지 않습니다', 'e');
}

// 새 셀 추가
async function addCell() {
  const type = ($('#newCellType')?.value || scType || 'appliance');
  const name = ($('#newCellName')?.value || '').trim();
  const leader = ($('#newCellLeader')?.value || '').trim();
  if (!name) return toast('추가할 신규 셀명을 입력하세요', 'e');
  const id = (type === 'ac' ? 'AC_' : 'GA_') + Date.now().toString(36) + Math.random().toString(36).slice(2, 4);
  const cells = [...S.cfg.cells, { id, type, name, leader }];
  const roster = { ...S.cfg.roster, [id]: leader ? [leader] : [] };
  scType = type;
  sc = id;
  await saveCfg({ cells, roster });
  render();
  toast(`${typeLabel(type)} [${name}] 셀이 추가되어 영구 저장되었습니다`);
}

// 셀 삭제 (기본 셀을 삭제해도 다시 살아나지 않도록 deletedCells에 기록)
async function delCell(cellId) {
  const c = cellOf(cellId);
  if (!c) return;
  if (S.cfg.cells.length <= 1) return toast('최소 1개의 셀은 유지되어야 합니다', 'e');
  if (!confirm(`[${typeLabel(c.type)} · ${c.name}] 셀을 삭제할까요?\n(삭제 내역은 영구 저장되며, 이미 저장된 서명 기록은 보존됩니다)`)) return;
  const cells = S.cfg.cells.filter(x => x.id !== cellId);
  const deletedCells = [...new Set([...(S.cfg.deletedCells || []), cellId])];
  const nextCell = cells.find(x => x.type === scType) || cells[0];
  scType = nextCell.type;
  sc = nextCell.id;
  await saveCfg({ cells, deletedCells });
  render();
  toast(`${c.name}이(가) 영구 삭제되었습니다`);
}

// 셀 정보 및 리더 저장
async function saveCellInfo() {
  const c = cellOf(sc); if (!c) return;
  const name = ($('#cn')?.value || '').trim();
  const leader = ($('#ln')?.value || '').trim();
  if (!name) return toast('셀명을 입력하세요', 'e');
  const cells = S.cfg.cells.map(x => x.id === sc ? { ...x, name, leader } : x);
  const roster = { ...S.cfg.roster };
  roster[sc] = sortRosterList(roster[sc] || [], leader);
  await saveCfg({ cells, roster });
  render();
  toast('셀 정보 및 리더가 영구 저장되었습니다');
}

// 명단에서 즉시 셀리더로 지정
async function setAsLeader(memberName) {
  const c = cellOf(sc); if (!c) return;
  const cells = S.cfg.cells.map(x => x.id === sc ? { ...x, leader: memberName } : x);
  const roster = { ...S.cfg.roster };
  roster[sc] = sortRosterList(roster[sc] || [], memberName);
  await saveCfg({ cells, roster });
  render();
  toast(`${memberName} 님이 ${c.name} 셀리더(최상단 고정)로 지정되었습니다`);
}

// 작업자별 차량번호 등록/수정
async function editCar(memberName) {
  const cur = carOf(memberName);
  const next = prompt(`${memberName} 프로님의 차량번호를 입력하세요\n(운수종사자 일상점검표 상단에 자동 표기됩니다)`, cur || '강원');
  if (next === null) return;
  const cars = { ...(S.cfg.cars || {}), [memberName]: next.trim() };
  await saveCfg({ cars });
  render();
  toast(`${memberName} 프로님의 차량번호가 저장되었습니다`);
}

// 인원 추가
async function addMember() {
  const v = ($('#rn')?.value || '').split(/[,，\n]/).map(x => x.trim()).filter(Boolean);
  if (!v.length) return toast('추가할 성명을 입력하세요', 'e');
  const c = cellOf(sc);
  const roster = { ...S.cfg.roster };
  const merged = [...rost(sc), ...v];
  roster[sc] = sortRosterList(merged, c ? c.leader : '');
  await saveCfg({ roster });
  render();
  toast('명단에 추가되어 영구 저장되었습니다');
}

// 인원 이름 수정
async function editMember(oldName) {
  const c = cellOf(sc);
  const cur = [...rost(sc)];
  const idx = cur.indexOf(oldName);
  if (idx < 0) return;
  const next = prompt('작업자 이름을 수정하세요', oldName);
  if (next === null) return;
  const name = next.trim();
  if (!name) return toast('성명을 입력하세요', 'e');
  if (cur.some((n, i) => i !== idx && n === name)) return toast('이미 등록된 이름입니다', 'e');
  cur[idx] = name;
  const newLeader = (c && c.leader === oldName) ? name : (c ? c.leader : '');
  const cells = S.cfg.cells.map(x => x.id === sc ? { ...x, leader: newLeader } : x);
  const roster = { ...S.cfg.roster, [sc]: sortRosterList(cur, newLeader) };
  const cars = { ...(S.cfg.cars || {}) };
  if (cars[oldName] && !cars[name]) { cars[name] = cars[oldName]; delete cars[oldName]; }
  await saveCfg({ cells, roster, cars });
  render();
  toast('인원 이름이 수정 및 영구 저장되었습니다');
}

// 인원 삭제
async function delMember(targetName) {
  const c = cellOf(sc);
  if (!confirm(`${targetName} 님을 명단에서 삭제할까요? (삭제 내역은 영구 저장되며, 이미 저장된 서명은 유지됩니다)`)) return;
  const cur = rost(sc).filter(n => n !== targetName);
  const newLeader = (c && c.leader === targetName) ? '' : (c ? c.leader : '');
  const cells = S.cfg.cells.map(x => x.id === sc ? { ...x, leader: newLeader } : x);
  const roster = { ...S.cfg.roster, [sc]: sortRosterList(cur, newLeader) };
  await saveCfg({ cells, roster });
  render();
  toast(`${targetName} 님이 명단에서 영구 삭제되었습니다`);
}

async function resetDefaultCells() {
  if (!confirm('셀 구성과 인원 명단을 기본값(가전 8개 셀 + 에어컨 8개 팀)으로 초기화할까요?\n(기존 서명 기록은 그대로 유지됩니다)')) return;
  await saveCfg({ cells: defCells(), roster: defRoster(), deletedCells: [], basicSeeded: true });
  scType = 'appliance';
  sc = 'BEST';
  render();
  toast('기본 16개 셀(가전 8·에어컨 8)로 초기화되었습니다');
}

async function toggleOff(ds) {
  let h = [...S.cfg.holidays], w = [...S.cfg.workdays];
  const tg = (a, v) => a.includes(v) ? a.filter(x => x !== v) : [...a, v].sort();
  if (dow(ds) === 0) w = tg(w, ds); else h = tg(h, ds);
  await saveCfg({ holidays: h, workdays: w }); render();
}

async function saveSettings() {
  const newPin = ($('#pn')?.value || '').trim();
  const comp = ($('#comp')?.value || '선진물류㈜').trim();
  if (!newPin) return toast('관리자 비밀번호를 입력해 주세요', 'e');
  const newDb = ($('#dbu')?.value || '').trim().replace(/\/$/, '');
  ls.set('tbm_db', newDb);
  await saveCfg({ opinion: $('#op').value, pin: newPin, company: comp });
  if (newDb !== DB) {
    toast('공유 주소가 저장되어 새로고침합니다');
    return setTimeout(() => location.reload(), 600);
  }
  render(); toast('양식 설정 및 비밀번호가 영구 저장되었습니다');
}

function exportBackup() {
  const raw = JSON.stringify(S);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(raw).then(() => toast('명단·서명 백업 데이터가 복사되었습니다')).catch(() => prompt('아래 내용을 전체 복사하세요', raw));
  } else {
    prompt('아래 내용을 전체 복사하세요', raw);
  }
}
async function importBackup() {
  const raw = prompt('복사해 둔 백업 데이터를 붙여넣으세요');
  if (!raw) return;
  try {
    const v = JSON.parse(raw);
    S = { sigs: v.sigs || {}, offs: v.offs || {}, cfg: fixCfg(v.cfg || {}) };
    persist();
    if (DB) await Promise.all([rput('cfg', S.cfg), rput('sigs', S.sigs), rput('offs', S.offs)]);
    render();
    toast('백업 데이터가 복원 및 영구 저장되었습니다');
  } catch (e) {
    toast('올바른 백업 데이터 형식이 아닙니다', 'e');
  }
}

// ---------- 렌더 ----------
function go(t) {
  tab = t;
  if (t === 'admin' && !cellOf(sc)) {
    scType = 'appliance';
    sc = (cellsOfType(scType)[0] || {}).id || '';
  }
  render();
}
function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  $('#mode').textContent = DB ? '실시간 서버공유' : '1인 1단말기';
  $('#hdrActions').innerHTML = (tab === 'admin' && adminOK)
    ? `<button type="button" class="b s" style="background:rgba(255,255,255,0.22);color:#fff;border:1px solid rgba(255,255,255,0.4)" onclick="openPinModal()">🔑 비번변경</button>`
    : '';
  $('#app').innerHTML = tab === 'field' ? fieldHTML() : adminHTML();
  if (tab === 'field') { upd(); initPad('#pad', v => pad = v); }
  fit();
}
window.addEventListener('resize', fit);
render(); poll(); setInterval(poll, 6000);
</script>
